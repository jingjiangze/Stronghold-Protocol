# front proxy for the blue/green pair. upstream.conf is the only file a deploy touches.
map $http_upgrade $conn_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # game socket
  location /ws {
    proxy_pass http://sp_current;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /healthz {
    proxy_pass http://sp_current;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
  }

  # hand static off to the CDN/mirror layer instead of serving it from this container:
  # the updater rewrites these targets, and a client that cannot reach the mirror still
  # gets the file from the app because of the fallback.
  location ~* ^/(assets|vendor|fonts|media|data)/ {
    set $mirror "";
    proxy_pass $mirror$request_uri;
    proxy_set_header Host "";
    proxy_cache off;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  location / {
    proxy_pass http://sp_current;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
  }
}
