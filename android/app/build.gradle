        // （static.js 的 PACK_INDEX_FILE 路由），extras 那张静态副本是死代码，删除并把断言改成
        // 钉实时索引。shell-ui-version 72→73。
        versionCode 2036
        versionName '0.3.0'
        buildConfigField 'String', 'EMBEDDED_APP_VERSION', '"0.2.6"'
        // fallback only: ServerList reads PROTOCOL_VERSION/APP_VERSION out of the embedded
        // shared/constants.js, so the compatibility gate always tracks the actual client
        buildConfigField 'int', 'EMBEDDED_PROTOCOL_VERSION', '1'
        buildConfigField 'String', 'DEFAULT_ORIGIN', '"https://stronghold.jiangjiangze.icu"'
        buildConfigField 'String', 'UPSTREAM_RELEASE_API', '"https://api.github.com/repos/sganggs/Stronghold-Protocol/releases/latest"'
        // EMBEDDED_ASSETS: 这个 APK 是否随包内嵌了 public/assets/**（由构建期 --no-assets 决定，
        // 见脚本末尾的 embeddedAssetsFlag()）。用途只有一个：内嵌版**不安装 art pack** —— 素材本机
        // 已经有了，装下去就是 379 MiB 的纯重复（审计 2026-10-09 §1.2）。无素材版必须装（那是它唯一
        // 的素材来源）。保守方向：默认 true（当作内嵌 → 跳过整轴安装）；万一标记写反，最坏是素材
        // 不走 pack，而 ArtCdn 回源缓存仍会兜住每一张缺图；写成 false 才会让内嵌版白下 379 MiB。
        buildConfigField 'boolean', 'EMBEDDED_ASSETS', String.valueOf(embeddedAssetsFlag())
        ndk {
            // Termux Node runtime staged per ABI by tools/apk/fetch-termux-node.mjs
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            // credentials never live in the repo: local build reads android/local.properties (gitignored),
            // CI injects SP_STORE_PASSWORD from a secret
            //
            // re-apk 线（2026-10-07 修订）：**与 apk 分支同一把 keystore**（同一证书、同一 applicationId），
            // 因此旧线设备可以**直接覆盖升级**（versionCode 2000 > 旧线 36）。业主拍板：re 线是旧线的后继版本，
            // 迁移单向（装了 re 之后不能装回旧线）。凭据仍只走 local.properties / CI secret（spStorePassword /
            // SP_STORE_PASSWORD，与旧线同名同源）。
            storeFile file('../stronghold.keystore')
            storePassword signingValue('spStorePassword', 'SP_STORE_PASSWORD')
            keyAlias 'stronghold'
            keyPassword signingValue('spStorePassword', 'SP_STORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress 'png', 'jpg', 'jpeg', 'webp', 'avif', 'gif', 'ogg', 'oga', 'opus', 'mp3', 'wav', 'm4a', 'aac', 'mp4', 'woff2', 'skel', 'bin', 'wasm', 'so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

/**
 * 构建期判定：这个 APK 内嵌了 public/assets/** 吗？
 *
 * 两条信息源，任一为真即认为「要内嵌」：
 *   ① 已组装好的 webroot 里真的存在 assets/ 目录（`--reuse` 场景：字节是上一次构建留下的）；
 *   ② 本次构建没被要求剥离素材（SP_NO_ASSETS / --no-assets 未开启）。
 *
 * 为什么必须看①：build-webroot 支持 --reuse（只重放 extras/补丁，不重拷上游树）。那种构建里
 * assets/ 是**上一次**留下的，本轮的 SP_NO_ASSETS 说明不了现状 —— 只看 env 会把一个明明带着
 * 381 MiB 素材的包标成「无素材」，于是设备去下 379 MiB 的 pack，重复存储原样复发。
 */
def embeddedAssetsFlag() {
    def webroot = rootProject.file('app/src/main/assets/webroot')
    def hasTree = new File(webroot, 'assets').isDirectory()
    if (hasTree) return true
    def v = (System.getenv('SP_NO_ASSETS') ?: '').trim().toLowerCase()
    return !(v == '1' || v == 'true' || v == 'yes')
}
