name: sync-upstream

# 唯一的上游同步控制器（《上游同步结构-修订版》Commit 03/06，Stage A/B in §2）。
# master = 控制面。它绝不触碰 apk：把“当前 apk + merge 指定上游 SHA”的测试候选写进
# apk-test，由 publish-test.yml 做 T1–T5 闸门；全绿后 promote.yml 才被允许提升到 apk。
# （旧的“候选 → sync/<sha> → PR → apk 直通车”已删除：apk 只在测试通过后变化。）
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '内容发布：上游已并入 apk 时也重建候选（用当前 apk HEAD 走同一闸门/发布链）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write        # force-write apk-test（staging 分支允许 force-update，apk 不允许）
  actions: write         # dispatch publish-test on apk-test（GITHUB_TOKEN 默认无此权限 → 403 integration）

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: sganggs/Stronghold-Protocol
  UPSTREAM_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the product branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: apk

      - name: Resolve upstream SHA; short-circuit when already integrated
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP_SHA="$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" --jq .sha)"
          echo "up=$UP_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UP_SHA" refs/remotes/origin/apk 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "upstream $UP_SHA already contained in apk — nothing to do"
          fi

      - name: Build the test candidate and write apk-test (apk stays untouched)
        id: cand
        if: steps.state.outputs.done != 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          UP_SHA: ${{ steps.state.outputs.up }}
        run: |
          git config user.name "stronghold-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          # CRITICAL: fetch the upstream SHA from the UPSTREAM repo itself — `origin` is our
          # fork whose master is a stale mirror and will never contain upstream's new objects.
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" 2>/dev/null || true
          git fetch --force upstream "refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream-master"
          git cat-file -e "$UP_SHA" || { echo "::error::upstream $UP_SHA still not fetchable"; exit 1; }
          git checkout -B candidate origin/apk
          if ! git merge --no-edit "$UP_SHA"; then
            git merge --abort || true
            echo "::error::upstream ${UP_SHA:0:8} does not merge cleanly — apk and apk-test untouched; resolve manually, then re-run"
            exit 1
          fi
          # Upstream must never edit OUR workflows. The controller pushes with the Actions token,
          # and a GitHub App without the `workflows` permission can neither create nor update
          # .github/workflows/** — any such diff fails the push outright (2026-10-07: upstream's
          # ci.yml changed and every candidate died at the push step). Upstream's CI is not ours
          # to run anyway: restore the whole directory to the apk side — including dropping files
          # upstream added — and the stamp below re-applies the control plane's own gate
          # workflows from master afterwards.
          git checkout origin/apk -- .github/workflows
          for f in $(git ls-tree -r --name-only HEAD -- .github/workflows); do
            git cat-file -e "origin/apk:$f" 2>/dev/null || git rm -q "$f"
          done
          git add -A .github/workflows
          # upstream release tag for the content identity（修订版 Commit 04）— best effort
          UP_TAG="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name 2>/dev/null || echo '')"
          # Gate workflow definitions run from the EVENT branch: the dispatched publish-test
          # executes apk-test's copy of publish-test.yml. A candidate built from apk does not
          # carry the control plane's latest gate logic, so stamp THIS checkout's copy
          # (master = the control plane source of truth) into the candidate. Product files
          # are never touched — only the gate workflows and the gate tool (verify-slim).
          git checkout "$GITHUB_SHA" -- .github/workflows/publish-test.yml .github/workflows/promote.yml tools/apk/verify-slim.mjs tools/security/sourcery_gate.py
          git add .github/workflows/publish-test.yml .github/workflows/promote.yml tools/apk/verify-slim.mjs tools/security/sourcery_gate.py
          # F2 覆盖层水位（发布采纳保证）：设备端只在 slim 自带 overlay 版本“严格大于”已装版本
          # 时才采纳，否则回退 APK 内置外壳（可能比设备现状更老）→ 视觉回退（2026-10-05 事故）。
          # 因此候选必须携带 > 线上 overlay 的版本号：内容方自带 C 高于线上 L 时用 C（正常递增），
          # 否则抬到 L+1（回声水位，拒绝重复占用同一版本号）。该文件随 PR 合并进 apk，成为
          # “已发布水位”标记。
          LIVE_OV="$(curl -fsS "https://weishucdn.jiangjiangze.icu/site/manifest.json?cb=$(date +%s)" 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s);process.stdout.write(String((v.shellOverlay||{}).version||""))}catch{}})')"
          CAND_OV="$(tr -dc '0-9' < tools/apk/shell-ui-version.txt)"
          test -n "$CAND_OV" || { echo "::error::candidate lacks tools/apk/shell-ui-version.txt"; exit 1; }
          PUB_OV="$(node -e 'const C=parseInt(process.argv[1]||"0",10)||0,L=parseInt(process.argv[2]||"0",10)||0;process.stdout.write(String(Math.max(C,L+1)))' "$CAND_OV" "$LIVE_OV")"
          echo "overlay watermark: candidate=$CAND_OV live=${LIVE_OV:-<none>} -> publish=$PUB_OV"
          if [ "$PUB_OV" != "$CAND_OV" ]; then
            printf '%s\n' "$PUB_OV" > tools/apk/shell-ui-version.txt
            git add tools/apk/shell-ui-version.txt
            echo "::notice::shell-ui overlay version raised to $PUB_OV (candidate $CAND_OV, live $LIVE_OV) — guarantees device adoption"
          fi
          PATCHES="$(ls tools/apk/patches/*.json | xargs -n1 basename | jq -R . | jq -s .)"
          jq -n --arg up "$UP_SHA" --arg tag "$UP_TAG" --arg base "$(git rev-parse origin/apk)" \
                --arg cand "$(git rev-parse HEAD)" --argjson patches "$PATCHES" --argjson overlay "$PUB_OV" \
            '{upstream: $up, upstreamTag: $tag, upstreamRepo: "'"$UPSTREAM_REPO"'", apkBase: $base,
              candidate: $cand, patches: $patches, shellUiVersion: $overlay, createdAt: (now | todate)}' \
            > lineage.json
          git add lineage.json
          git commit -m "sync: candidate lineage (upstream ${UP_SHA:0:8})"
          # apk-test is the movable staging branch — force-update is allowed HERE (never on apk).
          git push -f origin HEAD:apk-test
          echo "::notice::candidate $(git rev-parse --short HEAD) written to apk-test — publish-test.yml gates it; apk untouched"

      - name: Kick the apk-test gates (GITHUB_TOKEN pushes do NOT trigger workflows)
        if: steps.cand.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-test.yml --repo "${{ github.repository }}" --ref apk-test \
            || echo "::error::could not dispatch publish-test on apk-test — run it manually: gh workflow run publish-test.yml --ref apk-test"

      - name: Failure notice
        if: failure()
        run: |
          echo "::error::[sync-upstream] candidate build FAILED at upstream ${{ steps.state.outputs.up }}"
          echo "::error::apk and apk-test were NOT modified; fix the conflict, then re-run"
          exit 1
