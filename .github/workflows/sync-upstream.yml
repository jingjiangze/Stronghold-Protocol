name: sync-upstream

# Keep master-play near upstream (sganggs/Stronghold-Protocol).
#
# On a NEW upstream `vX.Y.Z` tag it prepares the merge on a branch and opens a PR — it never pushes to
# master-play and never resolves a conflict by itself. A conflict opens (or refreshes) an issue listing the
# files instead: the resolution is a judgement call about which of our features a hunk belongs to (our co-op
# economy, 救援, 快速匹配 and the CDN work all live on top of upstream files), and a wrong merge breaks the
# golden baselines and the client/server outcome equality.
#
# The gate for the PR is ci.yml (it runs on pull_request) — this workflow does not duplicate it.
#
#   Actions -> sync-upstream -> Run workflow   (optional: a specific tag)
#
# NOTE (measured 2026-10-09): on this fork `schedule` and `repository_dispatch` resolve against the DEFAULT branch
# (`master`, the APK product line), not `master-play`, and the dispatch API answers 422 "Actions has been disabled
# for this repository" while push-triggered workflows run normally. So the trigger that actually fires here is a
# PUSH to master-play: the job is a no-op unless the watermark is behind, which makes "run it with the next push"
# the practical way to drive it.
on:
  push:
    branches: [master-play]
  schedule:
    # daily, off-peak for upstream's timezone; the run is a no-op when the watermark is current
    - cron: '17 3 * * *'
  repository_dispatch:
    types: [sync-upstream]
  workflow_dispatch:
    inputs:
      tag:
        description: 'upstream tag to sync (empty = the newest v* tag)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: https://github.com/sganggs/Stronghold-Protocol.git
      BASE: master-play
      WATERMARK: .github/upstream-watermark.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master-play
          # shallow on purpose: the common run is a no-op (the watermark is current) and must not pay for history.
          # The merge step deepens the clone only when there is actually something to merge.
          fetch-depth: 1

      - name: Resolve the upstream tag to sync
        id: pick
        run: |
          set -e
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          want='${{ inputs.tag }}'
          if [ -z "$want" ]; then
            # ls-remote lists tags without downloading a single object: the cheap check the no-op path needs
            want=$(git ls-remote --tags --refs upstream 'refs/tags/v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
          fi
          [ -n "$want" ] || { echo "no upstream v* tag found"; exit 1; }
          have=$(python3 -c "import json;print(json.load(open('$WATERMARK'))['tag'])" 2>/dev/null || echo none)
          echo "tag=$want watermark=$have"
          echo "tag=$want" >> "$GITHUB_OUTPUT"
          # "newer than the watermark" is a version compare, not a name compare: a re-run for the same tag is a no-op
          newest=$(printf '%s\n%s\n' "$have" "$want" | sed 's/^v//' | sort -V | tail -1)
          if [ "$have" = "$want" ] || { [ "$have" != none ] && [ "$newest" = "${have#v}" ]; }; then
            echo "already at $have -> nothing to do"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Try the merge on a branch
        if: steps.pick.outputs.skip == '0'
        id: merge
        run: |
          set -e
          tag='${{ steps.pick.outputs.tag }}'
          branch="sync/$tag"
          # deepen only now: a merge needs the common ancestor, and the merge-base is what decides the conflicts
          git fetch --unshallow origin 2>/dev/null || true
          git fetch --tags --force upstream
          git checkout -b "$branch"
          # upstream's own tag: merge it whole, never cherry-pick (the goldens move with the sim)
          if git merge --no-ff --no-edit "$tag" >/tmp/merge.log 2>&1; then
            echo "clean=1" >> "$GITHUB_OUTPUT"
            python3 - "$tag" "$WATERMARK" <<'PY'
          import json, subprocess, sys, datetime
          tag, path = sys.argv[1], sys.argv[2]
          w = json.load(open(path))
          w['tag'] = tag
          w['sha'] = subprocess.check_output(['git', 'rev-list', '-n1', tag], text=True).strip()
          w['syncedAt'] = datetime.date.today().isoformat()
          w['mergeCommit'] = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD'], text=True).strip()
          json.dump(w, open(path, 'w'), ensure_ascii=False, indent=2)
          open(path, 'a').write('\n')
          PY
            git add "$WATERMARK"
            git commit -q -m "sync: upstream $tag (watermark)"
            git push -u origin "$branch"
          else
            echo "clean=0" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
            git merge --abort || true
            # 为什么这里把 merge 日志也收进来（2026-10-10 审计）：并不是每次 merge 失败都是「冲突」。
            # 实测 v0.2.3 那次是 `fatal: There is no merge to abort (MERGE_HEAD missing)` —— 没有 MERGE_HEAD，
            # 于是上面的 --diff-filter=U 拿到**空清单**，即使 issue 建成了也是一份空白的「冲突列表」，
            # 而真正的报错被 `>/tmp/merge.log 2>&1` 吞掉、从不打印。诊断变成了盲区。
            # 现在日志照样收，且**先落 run summary**（见下），issue 只是同一份内容的第二投递渠道。
            git checkout "$BASE"
            git branch -D "$branch" || true
            {
              echo "### upstream $tag 的合并有冲突"
              echo
              echo "**不要自动合。** 这些文件两边都改过，逐处判断哪一半属于我们的功能（协同经济 / 救援 / 快速匹配 / CDN）："
              echo
              echo '```'
              cat /tmp/conflicts.txt
              echo '```'
              echo
              echo "处理办法（本地）：\`git fetch upstream --tags && git merge --no-ff $tag\`，逐文件解完跑"
              echo "\`node --test\` + \`npm run golden\` + \`node tools/i18n.mjs check\`，然后手工推分支开 PR。"
              echo
              echo "已知的两类冲突：① 两边在同一处各加一行（保留两者）；② **DESIGN § 号撞车** —— 上游每个版本吃掉一个 § 号"
              echo "（0.2.0=§25 / 0.2.1=§26 / 0.2.2=§27），我们的自有文档要整体后移一位。"
              echo
              echo "<details><summary>git merge 原始输出（冲突清单为空时看这里 —— 失败未必是冲突）</summary>"
              echo
              echo '```'
              cat /tmp/merge.log 2>/dev/null || echo "(merge.log 缺失)"
              echo '```'
              echo
              echo "</details>"
            } > /tmp/body.md
            # ① 先落 run summary：这一步**不可能失败**，诊断永远留得下来。
            # ② issue 只是第二投递渠道，失败时不再让整个 step 以非零退出（2026-10-10 实测
            #    `GraphQL: Resource not accessible by integration (createIssue)` → exit 1，
            #    把「合并失败」这个真信号和「建不了 issue」这个假信号混成一个红）。
            cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"
            echo "::error::upstream $tag does not merge cleanly into $BASE — the report is in the run summary"
            title="sync: upstream $tag 需要人工解冲突"
            num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file /tmp/body.md || echo "(issue comment failed — the run summary already carries the report)"
            else
              gh issue create --title "$title" --body-file /tmp/body.md || echo "(issue create failed — the run summary already carries the report)"
            fi
            exit 1
          fi

      - name: Open the PR (clean merges only)
        if: steps.merge.outputs.clean == '1'
        run: |
          set -e
          tag='${{ steps.pick.outputs.tag }}'
          branch="sync/$tag"
          commits=$(git rev-list --count "$BASE..$branch")
          {
            echo "上游 **$tag** 的自动合并（$commits 个提交），无冲突。"
            echo
            echo "- 分支 \`$branch\` 从 \`$BASE\` 起，merge commit 是上游 tag 本身（golden 随模拟一起移动，不做 cherry-pick）。"
            echo "- 水位 \`$WATERMARK\` 已在本分支更新到 \`$tag\` —— **合并这个 PR 就等于推进水位**。"
            echo "- 门禁由 ci.yml 跑（pull_request 触发）。**合并前请人工审计**：冲突被自动解掉不代表语义正确，"
            echo "  重点看我们叠加在上游文件上的东西（协同经济 / 救援 / 快速匹配 / CDN / 60 fps 上限）还在不在。"
            echo "- 合并后记得确认 \`master-play\` 上的 golden 与 i18n 仍全绿，再看要不要出新包（release-cdn 会自己跑）。"
            echo
            echo "本仓未开 \"Allow GitHub Actions to create and approve pull requests\"，所以下面这条 PR 可能建不出来——"
            echo "那就改开 issue：分支已经在远端，人工 \`gh pr create --base $BASE --head $branch\` 即可。"
          } > /tmp/pr.md
          # GITHUB_TOKEN cannot open a PR unless the repo allows it (mirror-master.yml hit the same wall): fall back
          # to an issue so the work is never silently lost -- the branch is pushed either way.
          if ! gh pr create --base "$BASE" --head "$branch" --title "sync: upstream $tag" --body-file /tmp/pr.md 2>/tmp/pr.err; then
            echo "pr create failed: $(cat /tmp/pr.err)" >&2
            gh issue create --title "sync: upstream $tag 已合并干净，待开 PR" --body-file /tmp/pr.md
          fi

  # 2026-10-10 业主口径：「不要建太多临时分支，临时分支测试后一定删除」。
  # 上面那条 `sync/$tag` 是唯一还会长期留在远端的临时分支（开 PR 需要它当 head，所以不能在开完 PR 前删）。
  # 本仓没开 delete_branch_on_merge，PR 合并后分支会留下 → 这个 job 负责收尾：
  #   · 有**打开着**的 PR 拿它当 head        → 保留（删掉会连带把 PR 关掉）；
  #   · 有已合并 / 已关闭的 PR 拿它当 head   → 删除（工作已经进 BASE，或已被人工否决）；
  #   · 完全没有 PR 的孤儿分支               → 保留到 7 天宽限期满再删（人工可能正要补开 PR）。
  # 每一步都进 run summary；**只删 sync/ 前缀**，绝不动 master / master-play / re-apk 等长期分支。
  sweep-temp-branches:
    name: sweep sync/* temp branches
    runs-on: ubuntu-latest
    if: always()
    env:
      GH_TOKEN: ${{ github.token }}
      GRACE_DAYS: '7'
    steps:
      - name: Delete finished / orphaned sync/* branches (never one with an open PR)
        run: |
          set -uo pipefail
          {
            echo "## sync/* 临时分支清理（宽限 ${GRACE_DAYS} 天）"
            echo
            echo '| 分支 | 判定 | 处理 |'
            echo '| --- | --- | --- |'
          } > /tmp/sweep.md

          # 远端所有 sync/* 分支；没有就整段跳过（正常情况，别刷成失败）
          branches=$(gh api "repos/${{ github.repository }}/branches?per_page=100" --paginate \
                     --jq '.[] | select(.name|startswith("sync/")) | .name' || true)
          if [ -z "$branches" ]; then
            echo "_没有 sync/* 分支，无需清理。_" >> /tmp/sweep.md
            cat /tmp/sweep.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          now=$(date +%s)
          for b in $branches; do
            # 该分支当 head 的 PR（任意状态），取最新一条的状态与号
            pr=$(gh pr list --head "$b" --state all --limit 1 \
                 --json number,state --jq '.[] | "\(.number) \(.state)"' || true)
            num=${pr%% *}; state=${pr##* }
            if [ -n "$num" ] && [ "$state" = "OPEN" ]; then
              echo "| \`$b\` | PR #$num 打开中 | 保留（删 head 会关掉 PR） |" >> /tmp/sweep.md
              continue
            fi
            if [ -n "$num" ]; then
              echo "| \`$b\` | PR #$num 已 $state | 删除 |" >> /tmp/sweep.md
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" >/dev/null 2>&1 \
                || echo "| \`$b\` | 删除失败 | 见日志 |" >> /tmp/sweep.md
              continue
            fi
            # 孤儿分支：按最后提交时间算宽限
            when=$(gh api "repos/${{ github.repository }}/commits/$b" --jq '.commit.committer.date' 2>/dev/null || echo '')
            if [ -z "$when" ]; then
              echo "| \`$b\` | 读不到提交时间 | 保留（不猜） |" >> /tmp/sweep.md
              continue
            fi
            age=$(( (now - $(date -d "$when" +%s)) / 86400 ))
            if [ "$age" -ge "$GRACE_DAYS" ]; then
              echo "| \`$b\` | 无 PR，已 $age 天（≥ $GRACE_DAYS） | 删除 |" >> /tmp/sweep.md
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" >/dev/null 2>&1 \
                || echo "| \`$b\` | 删除失败 | 见日志 |" >> /tmp/sweep.md
            else
              echo "| \`$b\` | 无 PR，仅 $age 天 | 保留（宽限内，可能要补开 PR） |" >> /tmp/sweep.md
            fi
          done
          cat /tmp/sweep.md >> "$GITHUB_STEP_SUMMARY"
