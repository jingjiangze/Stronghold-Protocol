name: sync-upstream

# Upstream integration, PR #30 style: every candidate answers "which upstream, which
# apk base, which patch set" via a lineage manifest committed to the candidate branch,
# and promotion goes through a real PR (auto-merge enabled on the repo) instead of a
# bare push. master = upstream baseline + this one control file; apk = product.
#
#   schedule → detect upstream SHA → sync/<sha> = apk + merge upstream
#   → gates (patch anchors / npm ci / correctness / perf smoke / webroot asserts)
#   → PR sync/<sha> → apk with auto-merge → apk.yml builds & publishes on merge
#   FAIL: apk untouched; the candidate branch stays for forensics; run-level alerts.

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write        # push the candidate branch
  pull-requests: write   # open the integration PR + enable auto-merge

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: sganggs/Stronghold-Protocol
  UPSTREAM_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the product branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: apk

      - name: Resolve upstream SHA; short-circuit when already integrated
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP_SHA="$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" --jq .sha)"
          echo "up=$UP_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UP_SHA" refs/remotes/origin/apk 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "upstream $UP_SHA already contained in apk — nothing to do"
          fi

      - name: Build the candidate (sync/<short-sha> = apk + upstream)
        if: steps.state.outputs.done != 'true'
        id: cand
        env:
          GH_TOKEN: ${{ github.token }}
          UP_SHA: ${{ steps.state.outputs.up }}
        run: |
          git config user.name "stronghold-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          # fetch the upstream SHA into a real local ref — actions/checkout(ref=apk)
          # only brings the apk history, and a bare `git fetch origin master` parks the
          # result in FETCH_HEAD without guaranteeing the commit object is reachable for
          # `git merge <sha>` ("not something we can merge", 2026-10-04).
          git fetch --force origin "refs/heads/master:refs/remotes/origin/upstream-master"
          git cat-file -e "$UP_SHA" || { echo "::error::upstream $UP_SHA still not fetchable"; exit 1; }
          BR="sync/$(echo "$UP_SHA" | cut -c1-8)"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          git checkout -B "$BR" origin/apk
          if git merge --no-edit "$UP_SHA"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            git diff --name-only --diff-filter=U > conflict.txt || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lineage manifest (which upstream / apk base / patch set)
        if: steps.cand.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UP_SHA: ${{ steps.state.outputs.up }}
          BRANCH: ${{ steps.cand.outputs.branch }}
        run: |
          # PR #30's explicit-dependency idea: the candidate carries its own provenance,
          # so any future run/PR can answer "based on which upstream, which patches".
          PATCHES="$(ls tools/apk/patches/*.json | xargs -n1 basename | jq -R . | jq -s .)"
          jq -n --arg up "$UP_SHA" --arg base "$(git rev-parse origin/apk)" \
                --arg cand "$(git rev-parse HEAD)" --argjson patches "$PATCHES" \
            '{upstream: $up, upstreamRepo: "'"$UPSTREAM_REPO"'", apkBase: $base,
              candidate: $cand, patches: $patches, builtAt: (now | todate)}' \
            > lineage.json
          git add lineage.json
          git commit -m "sync: lineage manifest (upstream ${UP_SHA:0:8})"
          git push -f origin "HEAD:$BRANCH"

      - name: GATE 1 — patch anchors against the EXACT merged upstream tree
        if: steps.cand.outputs.merged == 'true'
        env:
          UP_SHA: ${{ steps.state.outputs.up }}
        run: |
          # Prove the anchors against the tree the candidate ACTUALLY merged (archive of
          # UP_SHA), not whatever the latest release happens to package. When upstream has
          # committed-but-not-released, the release zip is an older tree and this gate
          # would silently under-check (the 2026-10-04 audit finding).
          gh api "repos/$UPSTREAM_REPO/zipball/$UP_SHA" > /tmp/upstream.zip
          mkdir -p /tmp/pt && unzip -q /tmp/upstream.zip -d /tmp/pt
          TREE="$(find /tmp/pt -maxdepth 1 -mindepth 1 -type d | head -1)"
          echo "anchor target: $TREE (upstream $UP_SHA)"
          node tools/apk/check-patches.mjs "$TREE" || exit 1

      - name: Clean up merged sync/* candidates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # candidates whose SHA is already an ancestor of apk served their purpose;
          # failed candidates stay for forensics and are swept by the next green cycle.
          for BR in $(gh api "repos/${{ github.repository }}/branches" --paginate \
              --jq '.[] | select(.name | startswith("sync/")) | .name' 2>/dev/null); do
            SHA="$(gh api "repos/${{ github.repository }}/commits/$BR" --jq .sha)"
            if git merge-base --is-ancestor "$SHA" refs/remotes/origin/apk 2>/dev/null; then
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BR" && echo "deleted $BR (merged)"
            else
              echo "kept $BR (not yet in apk)"
            fi
          done

      - name: GATE 2 — install exactly the lockfile
        if: steps.cand.outputs.merged == 'true'
        run: npm ci --no-audit --no-fund

      - name: GATE 3 — correctness tests
        if: steps.cand.outputs.merged == 'true'
        run: |
          find test -name '*.test.js' ! -name 'robustness.test.js' | sort | xargs node --test

      - name: GATE 4 — performance smoke (advisory, CI threshold 1.0 ms/tick)
        if: steps.cand.outputs.merged == 'true'
        run: |
          OUT="$(node --test test/sim/robustness.test.js 2>&1)" && RC=0 || RC=$?
          echo "$OUT" | grep -E "^# (pass|fail)" || true
          if [ "$RC" -ne 0 ]; then
            AVG="$(echo "$OUT" | grep -oE 'avg [0-9.]+ ms/tick' | grep -oE '[0-9.]+' | head -1)"
            [ -n "$AVG" ] || { echo "perf failed without an avg line"; exit 1; }
            node -e "process.exit(parseFloat('$AVG') < 1.0 ? 0 : 1)" \
              || { echo "perf avg ${AVG} ms/tick exceeds the CI advisory threshold"; exit 1; }
          fi

      - name: GATE 5 — webroot asserts on the candidate
        if: steps.cand.outputs.merged == 'true'
        run: |
          # check-apk.mjs is the post-BUILD gate (needs the APK); here we assert the
          # tree-level invariants it would check. The candidate is a repo checkout:
          # web content lives under public/, the server at the root.
          for f in public/index.html data/assets.json server/index.js public/js/assets.js; do
            [ -f "$f" ] || { echo "::error::candidate missing $f"; exit 1; }
          done
          # crossOrigin guard survived the upstream merge (the 2026-10-03 taint incident)
          grep -q "crossOrigin" public/js/assets.js \
            || { echo "::error::assets.js lost the crossOrigin guard in the merge"; exit 1; }
          echo "webroot asserts: ok"

      - name: Open the integration PR (auto-merge on)
        if: steps.cand.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.cand.outputs.branch }}
          UP_SHA: ${{ steps.state.outputs.up }}
        run: |
          BODY="自动集成候选：\`apk\` ← upstream \`$UPSTREAM_REPO@$UP_SHA\`
          - lineage: \`lineage.json\`（该分支上，可审计 upstream/apkBase/patches）
          - 门禁: patch anchors / npm ci / correctness / perf smoke / webroot asserts（本 run 已跑）
          - 合并后 \`apk.yml\` 自动构建并发布（APK/Pages/R2）。"
          PRN="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null)"
          if [ -n "$PRN" ]; then
            gh pr edit "$PRN" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh pr create --repo "${{ github.repository }}" --base apk --head "$BRANCH" \
              --title "sync: upstream ${UP_SHA:0:8} → apk" --body "$BODY"
            PRN="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --json number --jq '.[0].number')"
          fi
          # auto-merge is enabled repo-wide; without required checks it merges as soon as
          # GitHub processes it — the gates already ran in THIS workflow before the PR.
          gh pr merge "$PRN" --repo "${{ github.repository }}" --auto --merge || \
            echo "::warning::auto-merge not armed; promote manually with gh pr merge $PRN"

      - name: Failure notice (the failed run IS the alert)
        if: failure()
        env:
          UP: ${{ steps.state.outputs.up }}
          BRANCH: ${{ steps.cand.outputs.branch }}
        run: |
          echo "::error::[sync-upstream] integration FAILED at upstream $UP"
          echo "::error::apk was NOT touched; candidate branch ${BRANCH:-n/a} kept for forensics"
          echo "::error::fix patch anchors / conflicts, then re-run; the PR (if any) stays open without auto-merge"
          exit 1
