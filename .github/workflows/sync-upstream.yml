name: sync-upstream

# 唯一的上游同步控制器（《上游同步结构-修订版》Commit 03/06，Stage A/B in §2）。
# master = 控制面。它绝不触碰 apk：把“当前 apk + merge 指定上游 SHA”的测试候选写进
# apk-test，由 publish-test.yml 做 T1–T5 闸门；全绿后 promote.yml 才被允许提升到 apk。
# （旧的“候选 → sync/<sha> → PR → apk 直通车”已删除：apk 只在测试通过后变化。）
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write        # force-write apk-test（staging 分支允许 force-update，apk 不允许）

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: sganggs/Stronghold-Protocol
  UPSTREAM_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the product branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: apk

      - name: Resolve upstream SHA; short-circuit when already integrated
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP_SHA="$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" --jq .sha)"
          echo "up=$UP_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UP_SHA" refs/remotes/origin/apk 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "upstream $UP_SHA already contained in apk — nothing to do"
          fi

      - name: Build the test candidate and write apk-test (apk stays untouched)
        id: cand
        if: steps.state.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UP_SHA: ${{ steps.state.outputs.up }}
        run: |
          git config user.name "stronghold-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          # CRITICAL: fetch the upstream SHA from the UPSTREAM repo itself — `origin` is our
          # fork whose master is a stale mirror and will never contain upstream's new objects.
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" 2>/dev/null || true
          git fetch --force upstream "refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream-master"
          git cat-file -e "$UP_SHA" || { echo "::error::upstream $UP_SHA still not fetchable"; exit 1; }
          git checkout -B candidate origin/apk
          if ! git merge --no-edit "$UP_SHA"; then
            git merge --abort || true
            echo "::error::upstream ${UP_SHA:0:8} does not merge cleanly — apk and apk-test untouched; resolve manually, then re-run"
            exit 1
          fi
          # upstream release tag for the content identity（修订版 Commit 04）— best effort
          UP_TAG="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name 2>/dev/null || echo '')"
          PATCHES="$(ls tools/apk/patches/*.json | xargs -n1 basename | jq -R . | jq -s .)"
          jq -n --arg up "$UP_SHA" --arg tag "$UP_TAG" --arg base "$(git rev-parse origin/apk)" \
                --arg cand "$(git rev-parse HEAD)" --argjson patches "$PATCHES" \
            '{upstream: $up, upstreamTag: $tag, upstreamRepo: "'"$UPSTREAM_REPO"'", apkBase: $base,
              candidate: $cand, patches: $patches, createdAt: (now | todate)}' \
            > lineage.json
          git add lineage.json
          git commit -m "sync: candidate lineage (upstream ${UP_SHA:0:8})"
          # apk-test is the movable staging branch — force-update is allowed HERE (never on apk).
          git push -f origin HEAD:apk-test
          echo "::notice::candidate $(git rev-parse --short HEAD) written to apk-test — publish-test.yml gates it; apk untouched"

      - name: Kick the apk-test gates (GITHUB_TOKEN pushes do NOT trigger workflows)
        if: steps.cand.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-test.yml --repo "${{ github.repository }}" --ref apk-test \
            || echo "::error::could not dispatch publish-test on apk-test — run it manually: gh workflow run publish-test.yml --ref apk-test"

      - name: Failure notice
        if: failure()
        run: |
          echo "::error::[sync-upstream] candidate build FAILED at upstream ${{ steps.state.outputs.up }}"
          echo "::error::apk and apk-test were NOT modified; fix the conflict, then re-run"
          exit 1
