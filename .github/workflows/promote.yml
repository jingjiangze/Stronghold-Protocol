name: promote

# 2026-10-08 退役：旧 apk 线的内容发布控制器不再运行。
#
# 统一 R2 命名空间后（tools/apk/line.mjs 的 SUFFIX 改为空串），生产内容指针 site/manifest.json
# 与 APK 指针 apk/latest.json 由 re 线的发布控制器独占写入
# （tools/apk/release-re.mjs → publish-manifest.mjs）。本工作流原先也写这两个键 ——
# 留着就是第二个写入者，一次 promote 就会把 re 线的生产指针覆盖掉。
#
# 触发方式也一并下线：原来的 workflow_run（publish-test 完成即自动 promote）已移除。
# 需要旧链代码时从 git 历史取：本文件在 2026-10-08 之前是完整的内容发布链。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: 旧线已退役
        run: |
          echo "::error::旧 apk 线的内容发布链已于 2026-10-08 退役，不再写生产清单指针。"
          echo "site/manifest.json 由 re 线发布控制器独占写入；需要旧链请从 git 历史恢复。"
          exit 1
