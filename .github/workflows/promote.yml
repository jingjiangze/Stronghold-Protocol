name: promote

# apk-test GREEN → apk（《上游同步结构-修订版》§4/§5.2）。
#   · 提升前必须复核 apk 当前 HEAD == 候选的 apkBaseSha；不一致就拒绝（重新生成候选）。
#   · HOT_ONLY 候选：开 PR → auto-merge，并把生产 manifest 指针切到“测试过的同一个
#     slim 工件”（下载测试清单里的 URL、sha256 校验逐字节一致，绝不重打包）。
#   · APK_REQUIRED 候选（动了 android/**）：只开 PR，不开清单指针——按 §5.2 的顺序
#     先发 APK；内容随新 APK 内嵌，后续内容候选再滚动生产清单。
on:
  workflow_run:
    workflows: ["publish-test"]
    types: [completed]
    branches: [apk-test]
  workflow_dispatch:
    inputs:
      staging:
        description: '被测候选（apk-test 的 staging head）。留空 = 当前 apk-test head（有竞态风险，不推荐）'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write    # F3 陈旧候选时自动重跑 sync-upstream（dispatch 需要 actions: write）

concurrency:
  group: promote-apk
  cancel-in-progress: false

env:
  CDN_BASE: https://weishucdn.jiangjiangze.icu

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk-test
          fetch-depth: 1

      - name: Pin the tested staging candidate (staging input; fallback = apk-test head)
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IN="${{ inputs.staging }}"
          if [ -z "$IN" ]; then
            IN="$(git rev-parse HEAD)"
            echo "::warning::no staging input — using the current apk-test head $IN; a newer candidate may have replaced the tested one (prefer the dispatched kick that passes staging)"
          else
            if ! git fetch origin "$IN" --depth=1 2>/dev/null; then
              git fetch origin apk-test --depth=1
            fi
            git checkout --force "$IN" 2>/dev/null \
              || { echo "::error::staging $IN not fetchable (candidate was force-replaced?)"; exit 1; }
          fi
          echo "staging=$IN" >> "$GITHUB_OUTPUT"
          git log --oneline -1

      - name: Read lineage (candidate provenance)
        id: lin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # F3: 一切身份锚定在“钉住的 staging 提交”上（步骤 pin），不再读可变的 apk-test 头——
          # 候选 A 被测、B 覆盖 apk-test 的竞态由此消除（A 的 promote 永远只见 A 的 lineage）。
          STAGING="${{ steps.pin.outputs.staging }}"
          if [ ! -f lineage.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no lineage.json on the pinned staging tree — baseline staging run, nothing to promote"
            exit 0
          fi
          # Baseline / stale-lineage guards: apk's tree carries the lineage of the LAST sync,
          # so a baseline staging (staging == apk) must never be "promoted".
          APK="$(gh api "repos/${{ github.repository }}/commits/apk" --jq .sha)"
          if [ "$STAGING" = "$APK" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::staging == apk (baseline staging) — nothing to promote"
            exit 0
          fi
          # lineage.candidate = the merge/baseline commit; the lineage.json commit is its child,
          # so the pinned staging's PARENT must match (candidate==HEAD is always false — 2026-10-04 bug).
          PARENT="$(gh api "repos/${{ github.repository }}/commits/$STAGING" --jq '.parents[0].sha')"
          if [ "$(jq -r .candidate lineage.json)" != "$PARENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::lineage.json is stale (candidate != staging HEAD^ $PARENT) — baseline staging; nothing to promote"
            exit 0
          fi
          {
            echo "staging=$STAGING"
            echo "upstream=$(jq -r .upstream lineage.json)"
            echo "upstream_tag=$(jq -r '.upstreamTag // ""' lineage.json)"
            echo "apk_base=$(jq -r .apkBase lineage.json)"
            echo "candidate=$(jq -r .candidate lineage.json)"
            echo "lineage_overlay=$(jq -r '.shellUiVersion // ""' lineage.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Guard — apk must still be the tested base (or the candidate already merged)
        if: steps.lin.outputs.skip != 'true'
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_HEAD="$(gh api repos/${{ github.repository }}/commits/apk --jq .sha)"
          echo "apk HEAD = $APK_HEAD ; tested apkBase = ${{ steps.lin.outputs.apk_base }}"
          if [ "$APK_HEAD" = "${{ steps.lin.outputs.apk_base }}" ]; then
            echo "merged_already=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Idempotent re-run: a previous promote merged this candidate into apk, so apk moved.
          # The candidate is then an ancestor of apk (compare apk...candidate == "behind").
          STATUS="$(gh api "repos/${{ github.repository }}/compare/apk...${{ steps.lin.outputs.candidate }}" --jq .status)"
          if [ "$STATUS" = "behind" ] || [ "$STATUS" = "identical" ]; then
            # F3 陈旧候选守卫：合并之后 apk 又被推了新 shell 内容（patches / extras / overlay
            # 版本任一变化）→ 本候选的 shell 快照已过时，发布它会把旧外壳+旧 overlay 号发上线
            # （2026-10-05 事故的近亲形态）。shell 身份不一致 = 拒绝发布 + 自动重建候选。
            git fetch origin apk --depth=1
            APK_SHELL="$(git ls-tree -r FETCH_HEAD -- tools/apk/patches tools/apk/extras tools/apk/shell-ui-version.txt | sha256sum | cut -d' ' -f1)"
            CAND_SHELL="$(git ls-tree -r HEAD -- tools/apk/patches tools/apk/extras tools/apk/shell-ui-version.txt | sha256sum | cut -d' ' -f1)"
            if [ "$APK_SHELL" != "$CAND_SHELL" ]; then
              echo "::error::apk HEAD 的 shell 身份已变化（apk $APK_SHELL != candidate $CAND_SHELL）——候选陈旧，拒绝发布；已请求重建候选"
              gh workflow run sync-upstream.yml --repo "${{ github.repository }}" --ref master || true
              exit 1
            fi
            echo "merged_already=true" >> "$GITHUB_OUTPUT"
            echo "merged_sha=$APK_HEAD" >> "$GITHUB_OUTPUT"
            echo "::notice::candidate already in apk ($STATUS), shell identity unchanged — continuing idempotently (publish only)"
            exit 0
          fi
          echo "::error::apk moved since this candidate was built (HEAD $APK_HEAD != tested base ${{ steps.lin.outputs.apk_base }}, candidate not merged) — refusing; re-run sync-upstream"
          exit 1

      - name: Classify candidate (HOT_ONLY vs APK_REQUIRED)
        if: steps.lin.outputs.skip != 'true'
        id: cls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="$(gh api "repos/${{ github.repository }}/compare/${{ steps.lin.outputs.apk_base }}...${{ steps.lin.outputs.candidate }}" --jq '[.files[].filename] | join("\n")' 2>/dev/null || true)"
          if printf '%s\n' "$FILES" | grep -q '^android/'; then
            echo "kind=APK_REQUIRED" >> "$GITHUB_OUTPUT"
            echo "candidate touches android/** → APK path"
          else
            echo "kind=HOT_ONLY" >> "$GITHUB_OUTPUT"
            echo "candidate is content-only → hot update path"
          fi
          printf '%s\n' "$FILES" | sed 's/^/  changed: /'

      - name: Security gate — Sourcery triage clean (SECRET/DEPENDENCY × CRITICAL/HIGH)
        if: steps.lin.outputs.skip != 'true'
        env:
          SOURCERY_API_KEY: ${{ secrets.SOURCERY_API_KEY }}
        run: |
          # A2: 合并前的 triage 门（与夜扫 security-gate.yml 同一语义，read-only；失败=不打 PR）。
          # 工具由控制器 stamp 进候选（sync-upstream 的 stamp 清单）。
          if [ -z "$SOURCERY_API_KEY" ]; then
            echo "::warning::SOURCERY_API_KEY secret missing — security gate skipped (advisory)"
            exit 0
          fi
          if [ ! -f tools/security/sourcery_gate.py ]; then
            echo "::warning::tools/security/sourcery_gate.py not on the pinned staging tree — gate skipped (advisory); check the controller stamp list"
            exit 0
          fi
          python3 tools/security/sourcery_gate.py --repos Stronghold-Protocol \
            --fail-types SECRET,DEPENDENCY --fail-severities CRITICAL,HIGH

      - name: Promote — PR apk-test → apk (auto-merge, then WAIT for the real merge)
        if: steps.lin.outputs.skip != 'true' && steps.guard.outputs.merged_already != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCERY_WAIT_SECONDS: ${{ vars.SOURCERY_WAIT_SECONDS }}
          SOURCERY_STRICT: ${{ vars.SOURCERY_STRICT }}
        run: |
          BODY="apk-test 全绿（T1–T5）后的自动提升。
          - upstream: \`${{ steps.lin.outputs.upstream }}\`
          - candidate: \`${{ steps.lin.outputs.candidate }}\`（lineage 在分支上可审计）
          - 分类: **${{ steps.cls.outputs.kind }}**
          - 合并后由本 workflow 的 APK 路径（或人工 dispatch apk.yml）构建壳；HOT_ONLY 的**生产 manifest 指针**由本 workflow 切到测试过的同一个 slim 工件（发布后原子验收）。"
          PRN="$(gh pr list --repo "${{ github.repository }}" --head apk-test --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$PRN" ]; then
            gh pr edit "$PRN" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh pr create --repo "${{ github.repository }}" --base apk --head apk-test \
              --title "promote: ${{ steps.lin.outputs.upstream }} → apk" --body "$BODY"
            PRN="$(gh pr list --repo "${{ github.repository }}" --head apk-test --json number --jq '.[0].number')"
          fi
          # A1: Sourcery 审查等待窗（接入 sourcery-ai[bot]）。默认 fail-open：窗口内没等到审查就
          # 带 notice 继续（bot 可能跳过 GITHUB_TOKEN 创建的 PR——首次实测即验证）；repo var
          # SOURCERY_STRICT=true 改为 fail-closed；bot 给出 CHANGES_REQUESTED 时无论如何拒绝合并。
          WINDOW="${SOURCERY_WAIT_SECONDS:-600}"
          WAITED=0; BOT_N=0; BOT_STATE=""; BOT_URL=""
          while [ "$WAITED" -lt "$WINDOW" ]; do
            REV="$(gh api "repos/${{ github.repository }}/pulls/$PRN/reviews?per_page=100" \
              --jq '[.[] | select(.user.login == "sourcery-ai[bot]")] | { n: length, state: ((last | .state) // ""), url: ((last | .html_url) // "") }' 2>/dev/null || echo '{"n":0,"state":"","url":""}')"
            BOT_N="$(printf '%s' "$REV" | jq -r .n)"
            if [ "${BOT_N:-0}" -gt 0 ]; then
              BOT_STATE="$(printf '%s' "$REV" | jq -r .state)"
              BOT_URL="$(printf '%s' "$REV" | jq -r .url)"
              break
            fi
            sleep 20; WAITED=$((WAITED + 20))
          done
          if [ "${BOT_N:-0}" -gt 0 ]; then
            echo "::notice::Sourcery reviewed PR #$PRN after ${WAITED}s — state=$BOT_STATE $BOT_URL"
            if [ "$BOT_STATE" = "CHANGES_REQUESTED" ]; then
              echo "::error::Sourcery requested changes on PR #$PRN — refusing to merge; address the review, then re-run promote"
              exit 1
            fi
          else
            echo "::notice::no Sourcery review on PR #$PRN within ${WINDOW}s — continuing (fail-open; set vars.SOURCERY_STRICT=true to block instead)"
            if [ "$SOURCERY_STRICT" = "true" ]; then
              echo "::error::SOURCERY_STRICT=true and no Sourcery review arrived — refusing to merge"
              exit 1
            fi
          fi
          # Arm auto-merge; if the repo has no branch-protection rules GitHub refuses to ARM it
          # ("Protected branch rules not configured") — then merge directly. The apkBase guard
          # already proved apk hasn't moved since the gates ran, so a synchronous merge is safe.
          gh pr merge "$PRN" --repo "${{ github.repository }}" --auto --merge 2>am.err || {
            echo "::notice::auto-merge not armable ($(tr -d '\r\n' < am.err | head -c 120)) — merging directly"
            gh pr merge "$PRN" --repo "${{ github.repository }}" --merge || {
              echo "::error::direct merge failed — production pointer stays put; resolve manually"
              exit 1
            }
          }
          # --auto only ARMS the merge; the manifest pointer must not move until the PR is
          # REALLY merged (else: apk stays old while production hot-update points at new
          # content — the 修订版 §7 failure mode). Poll, hard-fail on timeout.
          MERGED_SHA=""
          for i in $(seq 1 60); do   # 60 × 10s = 10 min
            STATE="$(gh pr view "$PRN" --repo "${{ github.repository }}" --json state,mergeCommit --jq '.state + " " + (.mergeCommit.oid // "")')" || STATE=""
            case "$STATE" in
              "MERGED "*)
                MERGED_SHA="${STATE#MERGED }"
                break
                ;;
              "CLOSED "*)
                echo "::error::promotion PR #$PRN was CLOSED without merging — production pointer stays put"
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ -z "$MERGED_SHA" ]; then
            echo "::error::promotion PR #$PRN did not merge within 10 minutes — production pointer stays put; merge it manually and re-run promote"
            exit 1
          fi
          echo "merged_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::promotion PR #$PRN merged: $MERGED_SHA"

      - name: "HOT_ONLY — hot update FIRST (promote the TESTED slim to production)"
        if: steps.lin.outputs.skip != 'true' && steps.cls.outputs.kind == 'HOT_ONLY' && (steps.pr.outputs.merged_sha != '' || steps.guard.outputs.merged_already == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          SP_SIGN_KEY: ${{ secrets.SP_SIGN_KEY }}
        run: |
          test -n "$SP_SIGN_KEY" || { echo "::error::SP_SIGN_KEY secret missing"; exit 1; }
          # materialise the signing key file FIRST — every gen-manifest/sign.mjs call below
          # reads $SP_SIGN_DIR/ed25519.key (tree versions differ on SP_SIGN_KEY env support)
          export SP_SIGN_DIR="$RUNNER_TEMP/sp-sign"
          mkdir -p "$SP_SIGN_DIR"
          printf '%s\n' "$SP_SIGN_KEY" > "$SP_SIGN_DIR/ed25519.key"
          # 上游同步的内容一律优先热更新（用户指令）：设备已装 APK（≥minApk）不重装即获得新上游内容。
          curl -fsS "https://weishucdn.jiangjiangze.icu/site/manifest-test.json?cb=$(date +%s)" -o manifest-test.json
          UP="${{ steps.lin.outputs.upstream }}"
          UPT="${{ steps.lin.outputs.upstream_tag }}"
          # F3 identity: 一切锚定在钉住的 staging 提交 + 闸门写下的 tested-id.json —— 唯一身份
          # 记录（staging/candidate/apkBase/upstream/slim 哈希/overlay 全在内），不读可变分支。
          STAGING="${{ steps.lin.outputs.staging }}"
          STG8="${STAGING:0:8}"
          TEST_TAG="test-$STG8"
          gh release view "$TEST_TAG" --repo "${{ github.repository }}" > /dev/null \
            || { echo "::error::no test release $TEST_TAG — the green gates never published for the tested staging $STG8; re-run the chain"; exit 1; }
          gh release download "$TEST_TAG" --repo "${{ github.repository }}" --pattern tested-id.json -O tested-id.json --clobber \
            || { echo "::error::test release $TEST_TAG lacks tested-id.json (gates predate the identity protocol) — re-run the chain"; exit 1; }
          node -e '
            const fs = require("fs");
            const t = JSON.parse(fs.readFileSync("tested-id.json", "utf8"));
            const L = JSON.parse(fs.readFileSync("lineage.json", "utf8"));
            const bad = (m) => { console.error("tested-id mismatch:", m, JSON.stringify(t)); process.exit(1); };
            if (t.staging !== process.argv[1]) bad("staging");
            if (t.candidate !== L.candidate) bad("candidate");
            if (t.upstream !== L.upstream) bad("upstream");
            if (t.apkBase !== L.apkBase) bad("apkBase");
            console.log("tested identity ok:", JSON.stringify({ staging: String(t.staging).slice(0, 8), buildTag: t.buildTag, overlay: t.overlay, slim: String(t.slimSha256).slice(0, 12) }));
          ' "$STAGING"
          node -e '
            const m = require("./manifest-test.json");
            if (process.argv[1] && m.upstreamTag !== process.argv[1]) {
              console.error("test manifest upstreamTag mismatch:", m.upstreamTag, "expected", process.argv[1]); process.exit(1);
            }
          ' "$UPT"
          SHA="$(node -e 'process.stdout.write(require("./manifest-test.json").slim.sha256)')"
          UT="$(node -e 'process.stdout.write(require("./manifest-test.json").upstreamTag||"v0.1.0")')"
          # minApk policy: the gates stamp the candidate's versionCode (35) — right for the test
          # channel, wrong for production: the main session's rule is "no forced APK update"
          # (production v2.8.11 deliberately carries minApk 22). Inherit the live manifest's
          # minApk so a content-only promote never forces a reinstall.
          LIVE0="$(curl -fsS "https://weishucdn.jiangjiangze.icu/site/manifest.json?cb=$(date +%s)" || true)"
          LIVE_MIN="$(echo "$LIVE0" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).minApk||""))}catch{}})')"
          TEST_MIN="$(node -e 'process.stdout.write(String(require("./manifest-test.json").minApk||21))')"
          MIN="$TEST_MIN"
          if [ -n "$LIVE_MIN" ] && [ "$LIVE_MIN" -lt "$TEST_MIN" ] 2>/dev/null; then MIN="$LIVE_MIN"; fi
          echo "publishing with minApk=$MIN (test=$TEST_MIN live=$LIVE_MIN)"
          # F1 prelude: install rclone/configure R2 in advance — the test APK's R2 sync below and the TAG allocation block both reuse it
          curl -sL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone-bin
          RC="$(find /tmp/rclone-bin -name rclone -type f | head -1)"
          "$RC" config create r2 s3 provider=Cloudflare access_key_id="$R2_ACCESS_KEY" secret_access_key="$R2_SECRET_KEY" endpoint=https://8641802a2d46497f1cc4e7a4cba365d2.r2.cloudflarestorage.com acl=private --non-interactive > /dev/null
          LIVE_TAG="$(echo "$LIVE0" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).buildTag||"")}catch{}})')"
          # Test APK → R2 sync (named by the production buildTag, i.e. the current LIVE_TAG at this point; the normal publish path passes TAG).
          # Idempotent: skip when the target key already exists in R2. On failure loud (set -e), aligned with the F4 philosophy.
          sync_apk_to_r2() {
            local APK_TAGL="$1"
            [ -n "$APK_TAGL" ] || { echo "::warning::sync_apk_to_r2: empty tag — skipped"; return 0; }
            if [ -z "$R2_ACCESS_KEY" ]; then echo "::warning::R2 secrets absent — APK mirror skipped"; return 0; fi
            # 审查发现（PR#26）· 中（发现 10）：本函数下载的是当前运行的 $TEST_TAG 的 APK，却用调用方
            # 给的标签命名上传——上传前校验「被测 APK 的构建标签 == 请求的标签」，不匹配即响亮失败
            # （宁可不发，也不把 APK 发到错误/无 URL 的标签下）。
            local APK_BUILDTAG
            APK_BUILDTAG="$(jq -r '.buildTag // ""' tested-id.json 2>/dev/null || true)"
            if [ "$APK_BUILDTAG" != "$APK_TAGL" ]; then
              echo "::error::APK mirror label mismatch: tested APK buildTag '$APK_BUILDTAG' != requested tag '$APK_TAGL' — refusing to publish a mislabelled APK"
              return 1
            fi
            # 审查发现（PR#26）· 高（发现 5）：对象已存在时只跳过 APK 传输（幂等），仍要继续生成并
            # 上传 latest.json——否则重试修不好过时的最新指针。用标志位而非提前 return。
            local APK_EXISTS=""
            if "$RC" lsf "r2:stronghold-assets/apk/$APK_TAGL.apk" > /dev/null 2>&1; then
              echo "R2 already holds apk/$APK_TAGL.apk — APK transfer skipped (latest.json still refreshed)"
              APK_EXISTS=1
            fi
            gh api "repos/${{ github.repository }}/releases/tags/$TEST_TAG" > rel-apk.json 2>/dev/null || { echo "::error::APK mirror: test release lookup failed"; return 1; }
            local APK_SIZE APK_DIGEST
            APK_SIZE="$(jq -r '[.assets[] | select(.name == "app-release.apk")][0].size // ""' rel-apk.json)"
            APK_DIGEST="$(jq -r '[.assets[] | select(.name == "app-release.apk")][0].digest // ""' rel-apk.json | sed 's/^sha256://')"
            [ -n "$APK_DIGEST" ] || { echo "::error::APK mirror: $TEST_TAG has no app-release.apk digest"; return 1; }
            gh release download "$TEST_TAG" --repo "${{ github.repository }}" --pattern app-release.apk -O app-release.apk --clobber
            echo "$APK_DIGEST  app-release.apk" | sha256sum -c -
            if [ -z "$APK_EXISTS" ]; then
              "$RC" copyto app-release.apk "r2:stronghold-assets/apk/$APK_TAGL.apk" \
                --header-upload "Content-Type: application/vnd.android.package-archive" \
                --header-upload "Cache-Control: public, max-age=31536000, immutable" \
                --s3-no-check-bucket --s3-upload-cutoff 64M --s3-chunk-size 64M --stats-one-line --stats 30s
            fi
            # 审查发现（PR#26）· 中（发现 7/8）：latest.json 必须报告被测 APK 的**真实** versionCode /
            # versionName，且 minApk 单独输出、不与之混用。
            #   · versionName：T4 把 APK 的 versionName 盖成了 buildTag，故取「被测 APK 实际带的」
            #     版本名 = buildTag 去掉 shell-v 前缀（优先 release 的 output-metadata.json 构建元数据）；
            #     绝不从已提交的 Gradle 文件读（那里是盖之前的旧版本名）。
            #   · versionCode：优先 output-metadata.json 里的真实 versionCode；否则取被测 staging 树的
            #     build.gradle —— T4 从不改 versionCode，故它与 APK 内的值一致（与 minApk 语义不同）。
            local OM_VC="" OM_VN=""
            if gh release download "$TEST_TAG" --repo "${{ github.repository }}" --pattern output-metadata.json -O om.json --clobber 2>/dev/null; then
              OM_VC="$(jq -r '.elements[0].versionCode // ""' om.json 2>/dev/null || true)"
              OM_VN="$(jq -r '.elements[0].versionName // ""' om.json 2>/dev/null || true)"
            fi
            local VC="${OM_VC:-}" VN="${OM_VN:-}"
            [ -n "$VC" ] || VC="$(sed -nE 's/.*versionCode[[:space:]]+([0-9]+).*/\1/p' android/app/build.gradle | head -n1)"
            [ -n "$VN" ] || VN="$(jq -r '.buildTag // ""' tested-id.json | sed -E 's/^shell-v//')"
            [ -n "$VC" ] || { echo "::error::APK mirror: cannot determine the tested APK versionCode"; return 1; }
            [ -n "$VN" ] || { echo "::error::APK mirror: cannot determine the tested APK versionName"; return 1; }
            VC="$VC" VN="$VN" APK_TAG="$APK_TAGL" APK_SHA="$APK_DIGEST" node -e '
              const fs = require("fs");
              const t = JSON.parse(fs.readFileSync("tested-id.json", "utf8"));
              const doc = {
                tag: process.env.APK_TAG,
                versionCode: Number(process.env.VC) || 0,
                versionName: process.env.VN || "",
                apkUrl: `${process.env.CDN_BASE}/apk/${process.env.APK_TAG}.apk`,
                notesUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.APK_TAG}`,
                sha256: process.env.APK_SHA,
                size: fs.statSync("app-release.apk").size,
                minApk: t.minApk ?? null,
                buildTag: t.buildTag || null,
                generated: new Date().toISOString(),
              };
              // 审查发现（PR#26）· 高（发现 3）：原脚本读 AP_TAG/AP_SHA（未导出）而 shell 导出的是
              // APK_TAG/APK_SHA，导致 tag/sha256 为空、apkUrl 指向 /undefined.apk。改用正确变量名并
              // 断言 apkUrl 含 tag、sha256 为 64 位十六进制，否则失败。
              if (!doc.tag || !doc.apkUrl.includes(doc.tag) || !/^[0-9a-f]{64}$/.test(doc.sha256 || "")) {
                console.error("latest.json integrity failed:", JSON.stringify({ tag: doc.tag, apkUrl: doc.apkUrl, sha256: doc.sha256 }));
                process.exit(1);
              }
              fs.writeFileSync("latest.json", JSON.stringify(doc, null, 2) + "\n");
              console.log("latest.json:", JSON.stringify({ tag: doc.tag, versionCode: doc.versionCode, apkUrl: doc.apkUrl }));
            '
            "$RC" copyto latest.json r2:stronghold-assets/apk/latest.json \
              --header-upload "Content-Type: application/json" --header-upload "Cache-Control: no-cache" --s3-no-check-bucket
            "$RC" lsf r2:stronghold-assets/apk/ 2>/dev/null | grep -E -- '-v[0-9]+\.[0-9]+\.[0-9]+\.apk$' | while read -r f; do
              printf '%s %s\n' "$(printf '%s' "$f" | sed -nE 's/.*v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')" "$f"
            done | sort -rV | tail -n +3 | awk '{print $2}' | while read -r f; do
              [ -n "$f" ] || continue
              echo "prune r2 apk/$f"
              "$RC" deletefile "r2:stronghold-assets/apk/$f"
            done
            echo "::notice::R2 APK mirror: $APK_TAGL.apk + latest.json (the bucket keeps the newest 2 APKs)"
          }
          # F2 assert: 发布的 overlay 必须 > 线上 overlay（控制器已抬水位）；不足 = 陈旧候选，拒发。
          STAMP_OV="$(tr -dc '0-9' < tools/apk/shell-ui-version.txt)"
          TEST_OV="$(node -e 'process.stdout.write(String((require("./manifest-test.json").shellOverlay||{}).version||""))')"
          LIVE_OV="$(echo "$LIVE0" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String((JSON.parse(s).shellOverlay||{}).version||""))}catch{}})')"
          # 幂等跳过：线上已携带与本候选相同的内容身份（同 upstreamSha 且 overlay ≥ 候选）→
          # 已由一次更新的运行发布过（并发候选/被取代的 staging），不重复发布，绿退出。
          LIVE_UP="$(echo "$LIVE0" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).upstreamSha||"")}catch{}})')"
          if [ -n "$LIVE_UP" ] && [ "$LIVE_UP" = "$UP" ] && [ -n "$LIVE_OV" ] && [ "$LIVE_OV" -ge "$STAMP_OV" ] 2>/dev/null; then
            sync_apk_to_r2 "$LIVE_TAG"
            echo "::notice::production already carries this candidate's content (upstreamSha ${UP:0:8}, overlay $LIVE_OV >= $STAMP_OV) — nothing to publish (superseded by an earlier publish); exiting green"
            exit 0
          fi
          node -e '
            const c = Number(process.argv[1] || 0), t = Number(process.argv[2] || 0), l = Number(process.argv[3] || 0);
            if (!t || t !== c) { console.error("overlay identity: manifest-test", t, "!= candidate file", c); process.exit(1); }
            if (!(t > l)) { console.error("overlay watermark: publish", t, "must be > live", l, "— candidate is stale; re-run sync-upstream (the controller raises the watermark)"); process.exit(1); }
            console.log("overlay watermark ok: publish=" + t + " live=" + l);
          ' "$STAMP_OV" "$TEST_OV" "$LIVE_OV"
          curl -fsSL "$(node -e 'process.stdout.write(require("./manifest-test.json").slim.url)')" -o slim.zip
          echo "$SHA  slim.zip" | sha256sum -c -   # 逐字节提升：与测试完全同一工件
          SIZE="$(stat -c %s slim.zip)"
          # ---- F1 tag 分配 v2（复用被测候选的 buildTag + 不覆盖硬门 + CAS 复检） --------------
          # v2 规则（2026-10-05 用户批准）：生产 buildTag **复用被测候选自己的 buildTag** —— 它在
          # 闸门期被分配为 live+1，天然单调，且使「生产清单 buildTag == 正式 release 名 == R2 APK
          # 名 == APK versionName」四者一致（旧规则生产=test+1，R2/release 恒落后一号）。
          # 复用条件：候选 tag 严格大于当前生产 tag；不满足（陈旧候选/并发窗口）→ 拒绝发布并要求
          # 重新 sync（绝不把陈旧内容顶到更高号上）。占用判定：shell-<TAG> release 若已存在，其
          # tested-id.staging == 本候选 staging → 是闸门期为该候选创建的正式 release，复用不算占用。
          PROD_TAG="$(echo "$LIVE0" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).buildTag||"")}catch{}})')"
          CAND_TAG="$(jq -r '.buildTag // ""' tested-id.json)"
          DECISION="$(node -e '
            const p = (s) => { const m = /shell-v(\d+)\.(\d+)\.(\d+)/.exec(String(s)); return m ? [+m[1], +m[2], +m[3]] : null; };
            const c = p(process.argv[1]), l = p(process.argv[2]);
            if (!c) { process.stdout.write("invalid"); process.exit(0); }
            if (!l) { process.stdout.write("reuse"); process.exit(0); }
            for (let i = 0; i < 3; i++) {
              if (c[i] !== l[i]) { process.stdout.write(c[i] > l[i] ? "reuse" : "stale"); process.exit(0); }
            }
            process.stdout.write("stale");
          ' "$CAND_TAG" "$PROD_TAG")"
          echo "tag decision: $DECISION (candidate $CAND_TAG, production $PROD_TAG)"
          if [ "$DECISION" != "reuse" ]; then
            echo "::error::candidate buildTag $CAND_TAG is not ahead of production $PROD_TAG ($DECISION) — the candidate is stale or superseded; re-run sync-upstream to build a fresh candidate. Refusing to publish (never regress content behind a higher number)."
            exit 1
          fi
          TAG="$CAND_TAG"
          n=0
          while [ "$n" -lt 10 ]; do
            if ! gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then break; fi
            # 已存在的同名 release 若就是闸门期为「本候选」创建的正式 release（staging 一致）→ 复用
            if gh release download "$TAG" --repo "${{ github.repository }}" --pattern tested-id.json -O tid-occ.json --clobber 2>/dev/null \
               && [ "$(jq -r '.staging // ""' tid-occ.json 2>/dev/null)" = "$STAGING" ]; then
              echo "::notice::release $TAG is this candidate's own gate-time publication — reusing it"
              break
            fi
            # 审查发现（PR#26）· 中（发现 9）：静默把 TAG 推进到下一个号会让已构建/已签名的构件
            # （manifest.json / slim.zip / APK 的 versionName）仍标识旧 TAG，从而发布「身份不一致」
            # 的构件。本步骤无法在不重建的前提下重新标识构件，而重建属于上层（sync-upstream 控制器）
            # 的职责——故这里**有意响亮失败**，绝不静默推进。
            echo "::error::release $TAG already exists and belongs to a different candidate — the built artifacts (manifest/slim/APK versionName) are stamped with $TAG and cannot be re-labelled without a rebuild; refusing to advance the tag silently. Re-run sync-upstream to build a fresh candidate."
            exit 1
          done
          [ "$n" -lt 10 ] || { echo "::error::could not find a free buildTag"; exit 1; }
          # CAS 复检：算完再读一次生产清单——若其 buildTag 已 >= 我们的 TAG（并发写入者抢先），
          # 绝不覆盖，直接失败（唯一发布者 + 不覆盖原则）。
          LIVE="$(curl -fsS "https://weishucdn.jiangjiangze.icu/site/manifest.json?cb=$(date +%s)" || true)"
          LIVE_TAG="$(echo "$LIVE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).buildTag||"")}catch{}})')"
          CMP="$(node -e '
            const p = (s) => { const m = /shell-v(\d+)\.(\d+)\.(\d+)/.exec(String(s)); return m ? [+m[1], +m[2], +m[3]] : null; };
            const A = p(process.argv[1]), B = p(process.argv[2]);
            if (!B) { process.stdout.write("gt"); process.exit(0); }
            if (!A) { process.stdout.write("le"); process.exit(0); }
            for (let i = 0; i < 3; i++) if (A[i] !== B[i]) { process.stdout.write(A[i] > B[i] ? "gt" : "le"); process.exit(0); }
            process.stdout.write("le");
          ' "$TAG" "$LIVE_TAG")"
          [ "$CMP" = "gt" ] || { echo "::error::concurrent publish detected: live $LIVE_TAG >= our $TAG — refusing to overwrite; re-run the chain"; exit 1; }
          echo "buildTag for this publish: $TAG (live=$LIVE_TAG)"
          # slim 上 R2 首方直链：Updater 的镜像链（ghfast 等）只理解 GitHub URL，对 R2 直链
          # 前缀无意义；把 slim.url 指到 R2 让首方 CDN 成为第一下载源，GitHub release 资产保留作镜像兜底。
          node tools/apk/gen-manifest.mjs --tag "$TAG" --upstream "$UT" \
            --min-apk "$MIN" --slim slim.zip \
            --slim-url "${{ env.CDN_BASE }}/apk/content-slim-${TAG}.zip" --out manifest.json
          # content identity（Commit 04）：candidate-tree gen-manifest may predate these fields —
          # inject them and re-sign (canonical covers everything but `sig`).
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            delete m.sig;
            m.upstreamSha = process.argv[1];
            m.contentVersion = (m.upstreamTag || "unknown") + "-" + process.argv[1].slice(0, 8);
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
          ' "$UP"
          node tools/apk/sign.mjs sign manifest.json
          node tools/apk/sign.mjs verify manifest.json --pub-bin tools/apk/shell/pubkey.bin
          rm -rf "$SP_SIGN_DIR"
          OVERLAY="$(node -e 'process.stdout.write(String((require("./manifest.json").shellOverlay||{}).version||""))')"
          CV="${UT}-${UP:0:8}"
          if [ -z "$R2_ACCESS_KEY" ]; then
            echo "::warning::R2 secrets absent — production manifest NOT published; demo run only"
            exit 0
          fi
          # 不覆盖原则的最后一道门：上传前重新检查 tag 占用（release 与 R2 对象任一存在即拒）。
          # 审查发现（PR#26）· 高（发现 4）：但**已验证匹配本候选**的 release 必须放行——闸门期
          # 就已为这个候选创建了 shell-<TAG> release（tested-id.staging == 本 staging），它是本
          # 候选自己的正式发布，不是“占用”；只有不属于本候选的占用才拒绝（2026-10-05 实测即因此误伤）。
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release download "$TAG" --repo "${{ github.repository }}" --pattern tested-id.json -O tid-pre.json --clobber 2>/dev/null \
               && [ "$(jq -r '.staging // ""' tid-pre.json 2>/dev/null)" = "$STAGING" ]; then
              echo "::notice::release $TAG is this candidate's own gate-time publication — allowed (not an occupancy)"
            else
              echo "::error::$TAG 已被 release 占用 — refusing to overwrite"; exit 1
            fi
          fi
          # 审查发现（PR#26）· 中（发现 6）：若 R2 已有 content-slim-<TAG>.zip，且其内容与本候选被测的
          # slim 逐字节一致（同 TAG、sha256 校验通过）→ 属于本候选上次尝试留下的对象，验证并复用
          # （跳过重复上传）；只有校验不一致才拒绝，绝不覆盖别的候选。
          SLIM_EXISTS=""
          if "$RC" lsf r2:stronghold-assets/apk/ 2>/dev/null | grep -qx "content-slim-${TAG}.zip"; then
            if "$RC" copyto "r2:stronghold-assets/apk/content-slim-${TAG}.zip" existing-slim.zip 2>/dev/null \
               && [ "$(sha256sum existing-slim.zip | cut -d' ' -f1)" = "$SHA" ]; then
              echo "::notice::R2 content-slim-${TAG}.zip matches this candidate's tested slim — reusing it"
              SLIM_EXISTS=1
            else
              echo "::error::R2 already holds a DIFFERENT content-slim-${TAG}.zip — refusing to overwrite"; exit 1
            fi
          fi
          # the R2 copy the Updater's built-in fallback derives from buildTag（content-slim-<tag>.zip）
          [ -n "$SLIM_EXISTS" ] || "$RC" copyto slim.zip "r2:stronghold-assets/apk/content-slim-${TAG}.zip"
          "$RC" copyto manifest.json r2:stronghold-assets/site/manifest.json
          # ---- F4 发布后原子验收：回读生产清单逐字段比对（CF 传播给 12×10s 重试） ----------
          OK=""
          for i in $(seq 1 12); do
            LIVE2="$(curl -fsS "https://weishucdn.jiangjiangze.icu/site/manifest.json?cb=$(date +%s%N)" || true)"
            if printf '%s' "$LIVE2" | node -e '
              let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => {
                let m; try { m = JSON.parse(s); } catch { process.exit(1); }
                const slim = m.slim || {};
                const ok = m.buildTag === process.argv[1]
                  && m.upstreamSha === process.argv[2]
                  && m.contentVersion === process.argv[3]
                  && slim.sha256 === process.argv[4]
                  && Number(slim.size) === Number(process.argv[5])
                  && Number((m.shellOverlay || {}).version) === Number(process.argv[6])
                  && Number(m.minApk) === Number(process.argv[7]);
                if (!ok) console.error("live:", JSON.stringify({ buildTag: m.buildTag, upstreamSha: m.upstreamSha, contentVersion: m.contentVersion, sha: slim.sha256, size: slim.size, overlay: (m.shellOverlay || {}).version, minApk: m.minApk }));
                process.exit(ok ? 0 : 1);
              });
            ' "$TAG" "$UP" "$CV" "$SHA" "$SIZE" "$OVERLAY" "$MIN" 2>/dev/null; then OK=1; break; fi
            sleep 10
          done
          [ -n "$OK" ] || { echo "::error::PRODUCTION VERIFICATION FAILED — the live manifest does not match this publish (a concurrent publisher may have overwritten it; investigate before retrying)"; exit 1; }
          echo "::notice::PRODUCTION VERIFIED: buildTag $TAG (content $CV @ ${UP:0:8}) minApk=$MIN overlay=$OVERLAY sha256 ${SHA:0:16}…"
          sync_apk_to_r2 "$TAG"

      - name: APK_REQUIRED — the single Release Controller drives the APK build (no push triggers)
        if: steps.lin.outputs.skip != 'true' && steps.cls.outputs.kind == 'APK_REQUIRED' && (steps.pr.outputs.merged_sha != '' || steps.guard.outputs.merged_already == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # apk.yml 已退出 push/release 自动触发（唯一发布权在 promote）：这里显式请求构建，
          # 并把 APK 挂到与本候选版本号一致的壳 release（apk.yml 的 release_tag 输入）。
          VER="$(sed -nE "s/.*versionName[[:space:]]+'([^']+)'.*/\1/p" android/app/build.gradle | head -n1)"
          test -n "$VER" || { echo "::error::cannot read versionName from the candidate tree"; exit 1; }
          if ! gh release view "shell-v$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::creating release shell-v$VER (target apk) for the tested APK"
            gh release create "shell-v$VER" --repo "${{ github.repository }}" --target apk \
              --title "shell v$VER" \
              --notes "APK v$VER（由 promote 的 APK_REQUIRED 路径驱动的构建；apk.yml dispatch 附加资产）。"
          fi
          gh workflow run apk.yml --repo "${{ github.repository }}" --ref apk -f "release_tag=shell-v$VER"
          echo "::notice::APK build dispatched: apk.yml ref=apk release_tag=shell-v$VER — the content rides the new APK's embedded webroot; a later content-only candidate rolls the production manifest"
