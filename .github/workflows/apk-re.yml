# re-apk 线：独立产品线（2026-10-07 起）
#
# 与 apk 线的关系：**完全独立**。
#   · 版本号跟随上游官方（versionName = 官方号，如 0.2.1；versionCode 用 major*1e6+minor*1e3+patch 合成），
#     本工作流**故意不修改 versionName**（旧线的 T4 会把它盖成 buildTag，那是旧线的规则）。
#     2026-10-07 起 versionName = 0.2.1 / versionCode = 2001（major*1e6+minor*1e3+patch）。
#   · 签名与 apk 分支**同一把 keystore**（2026-10-07 修订）：secret 与旧线相同
#     （STRONGHOLD_KEYSTORE_B64 / SP_STORE_PASSWORD），applicationId 不变，versionCode 更高
#     （0.2.1 -> 2001 > 旧线 36）→ 旧线设备可**直接覆盖升级**，玩家数据/prefs 保留。
#     内容清单的 minApk 同为 2001（tools/apk/release-re.mjs 的 MIN_APK）→ 旧线构建拿不到 re 线内容。
#   · R2 命名空间（唯一真源 = tools/apk/line.mjs，Java 侧 = Line.java）：**统一、不带 re 后缀**
#     （2026-10-08 旧线退役后合并成一条产品线）：
#       apk/stronghold-v<官方号>.apk · apk/latest.json · assets/ ·
#       site/servers.json · site/manifest.json
#     过渡期遗留的 `-re` 对象（apk/re-*.apk、apk/latest-re.json、assets-re/、site/servers-re.json、
#     site/manifest-re.json）由 R2 清理任务回收，本工作流不再写它们。
#
# 素材热更新链：build-webroot(内含 PNG→WebP 自动转码) → make-cdn → R2/weishucdn →
#   设备侧 manifest 指向 CDN。素材的版本号随 data/assets.json 走 slim 清单，所以
#   **"素材热更新 = 重跑本工作流"**，不需要另发 APK。
#
# 转码依赖 Pillow（tools/apk/transcode-assets.mjs）：没有它 build-webroot 会大声失败。
# **编码器 pin（2026-10-08）**：同一份 PNG 经不同 WebP 编码器/版本产出不同字节，而本 workflow 有
#   两个 job 都要转码 —— build job 把产物**内嵌进 APK**，assets job 把产物**镜像到 R2 CDN**。两边
#   一旦用不同编码器或不同 Pillow 版本，同一路径的 APK 内嵌字节与 CDN 字节就会分叉（素材热更线
#   P0 的验收前提是二者可互换）。因此：workflow 级 env 固定 SP_WEBP_ENCODER=pillow + 下面两个 job
#   安装**完全相同的** Pillow pin；detectEncoders 的探测顺序里 ffmpeg/magick 排在 Pillow 之后，
#   显式 pin 把「静默换编码器」变成「大声失败」。
name: apk-re

env:
  SP_WEBP_ENCODER: pillow
  PILLOW_PIN: 'Pillow==12.3.0'

on:
  # 单一发布者收敛（2026-10-05）：push / release 自动触发已下线——正式构建只由唯一 Release
  # Controller（promote.yml 的 APK_REQUIRED 路径，dispatch 本 workflow 并显式传 release_tag）
  # 发起；人工 dispatch 保留用于诊断 / 重建 / 紧急验证。正式 release 资产不再由此自动产生。
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag to build from (e.g. v0.1.0). Empty = latest.'
        required: false
        default: ''
      release_tag:
        description: 'Attach the built APK to this release (e.g. shell-v2.9.6). Empty = derive from versionName.'
        required: false
        default: ''
      no_assets:
        description: 'Ship NO public/assets/** in the APK (art comes from the CDN). Default false = assets EMBEDDED.'
        required: false
        type: boolean
        default: false

# 只由 dispatch 触发（无 batch-publish 的 push 洪峰），concurrency 只需保证同 ref 最新一次构建胜出。
concurrency:
  group: apk-re-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # the ubuntu runner ships the Android SDK; just install the packages we need
      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PNG→WebP 转码挂在 build-webroot 里（tools/apk/transcode-assets.mjs）：缺 Pillow 会大声失败，
      # 所以必须先备好。runner 自带时这条是幂等的；**不加 || true** —— 真装不上就该红。
      # 顺序：Pillow 必须在全量单测**之前**，否则 transcode-assets.test.mjs 的真实编码器用例会跳过。
      # Pin = 与 assets job 完全一致（env.PILLOW_PIN）：两个 job 的 WebP 字节不允许分叉。
      - name: Ensure the pinned Pillow for the PNG→WebP asset transcode
        run: python -m pip install --disable-pip-version-check --quiet "$PILLOW_PIN"

      # 全量壳侧单测（审计 GATE-R2）。旧版只跑 player-merge + overlay-loader 两个文件，于是
      # home-layer / room-hook / core-hooks / skin-layer / appearance / publish-float / room-lifecycle
      # 的行为回归在 CI 里完全没有覆盖。现在 22 个 *.test.mjs 全跑。
      # 明确说明（不是静默跳过）：只有下面几类用例会按环境自我 skip，且都带原因：
      #   · transcode-assets.test.mjs 的真实 WebP 编码器用例 —— Pillow 已装，本 CI 会真跑；
      #   · overlay-loader.test.mjs / overlay-sp-connect.test.mjs 的「已构建 webroot」用例 —— 本步
      #     在 build-webroot 之前跑（快速失败），webroot 尚未生成，按 t.skip('webroot not built') 跳过；
      #     这些集成用例由随后的 build + check-apk 覆盖；
      #   · check-upstream-contract.test.mjs 的「本地 upstream 解包树 / --runtime 启动」用例 —— CI 上
      #     没有 dl-cache 解包树，按 t.skip 跳过；同一契约在下面的 GATE 步骤里对上游 zipball 真跑。
      - name: Shell tool unit tests (FULL suite)
        run: node --test tools/apk/*.test.mjs

      # 归档优先（2026-10-10）：Termux pool 是活仓库 —— CI 已连续两次死在这条链上（libsqlite 的
      # .deb 在新 revision 落地当天从 pool 里 404，tuna 镜像同时拒连）。现在运行时输入钉死到一份
      # 不可变归档：下载 → sha256 必须等于下面的 pin → 解包（Node zlib + JS tar 解析，不用系统 tar：
      # Windows 上原生 spawn 的 MSYS tar 会在 115 MB gzip 成员上截断，本地已复现）→ 按归档内
      # input-manifest.json 逐文件核对（路径/字节/sha256/totalBytes，任何一项不符 = 立即红，
      # 绝不静默用坏字节）→ 才进 jniLibs 的 extract/stage/patch 流水线。归档不可用（网络 / 哈希
      # 不符）才回退活体镜像（packages.termux.dev → tuna），所以归档不是新的单点。
      # 一行切换自托管：把**同一份字节**传到我们自己的 release 后，只改下面两行 URL + SHA256
      # （脚本内默认值相同，见 tools/apk/fetch-termux-node.mjs 头部）。哈希是信任锚 —— 下载失败时
      # 不要改 sha 去「修」，要么交付完全相同的字节，要么让它走镜像回退。
      - name: Fetch Termux Node 24 runtime (pinned archive first, live mirrors as fallback)
        env:
          SP_TERMUX_RUNTIME_ARCHIVE_URL: 'https://github.com/Fuhua-code/Stronghold-Protocol/releases/download/android-runtime-node24.18.0-r1/stronghold-runtime-node24.18.0-r1.tar.gz'
          SP_TERMUX_RUNTIME_ARCHIVE_SHA256: '5bab822a770b2609394bd107412b539a3c013c7f0ad8e320e8f5ce77ae7bab76'
        run: node tools/apk/fetch-termux-node.mjs

      - name: GATE — upstream patch anchors + runtime contract (fail early, list every break)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Three independent gates against the SAME upstream tree:
          #   · patch anchors  — re-apk ships an empty patch set, so this now proves the parse gate
          #     and the runtime contract too (audit §6.1: an empty set must not make the gate true).
          #   · runtime contract (GATE-R1) — the DOM anchors / module exports / startServer() shape /
          #     i18n label set the shell overlay depends on (audit §8.4). Passed explicitly so the
          #     gate is named in the CI log; check-patches runs the same check internally.
          #   · extras overlap (GATE-R5) — extras/public+server+overlay must not silently shadow an
          #     upstream path except the declared vendored title pair, and that pair must still exist
          #     upstream (audit B5/R-14). copyExtras runs AFTER the upstream copy, so a collision
          #     would drop upstream's file with no other symptom.
          TAG="${{ inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api repos/sganggs/Stronghold-Protocol/releases/latest --jq '.tag_name')"
          fi
          echo "anchor target: upstream $TAG"
          gh api "repos/sganggs/Stronghold-Protocol/zipball/$TAG" > /tmp/upstream.zip
          mkdir -p /tmp/anchor && unzip -q /tmp/upstream.zip -d /tmp/anchor
          TREE="$(find /tmp/anchor -maxdepth 1 -mindepth 1 -type d | head -1)"
          node tools/apk/check-patches.mjs "$TREE"
          node tools/apk/check-upstream-contract.mjs "$TREE"
          node tools/apk/check-extras-overlap.mjs "$TREE"

      - name: Build embedded webroot from upstream release (with shell patches)
        env:
          # ONLY the explicit dispatch input pins the upstream tag. Our own shell release
          # events carry tags like shell-v2.6.2 which do NOT exist upstream — passing them
          # made the build 404 (2026-10-03); release builds follow the upstream latest.
          SP_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          # Authenticate the upstream release lookup: the shared runner IP otherwise hits the
          # unauthenticated GitHub API rate limit and the step dies with "upstream API HTTP 403".
          GITHUB_TOKEN: ${{ github.token }}
          # 素材不随包（审计 2026-10-09 §2.2）：APK 571.7 → 189.3 MiB。素材走 CDN 同源回源
          # （ArtCdn + filesDir/art/cache），前置已就绪（verify-cdn 硬门 + art packs +
          # manifestArtVersion>0）。只作用于**本 job**（打 APK）；下面的 assets job 仍要完整
          # 素材树去产 CDN 镜像，绝不能跟着剥离。
          SP_NO_ASSETS: ${{ inputs.no_assets && '1' || '' }}
        run: node tools/apk/build-webroot.mjs

      - name: Boot-gate the assembled webroot (P0, 2026-10-18)
        # 0.3.1 服务端运行期 import '../../public/js/…'；vc2046/vc2047 的 CI 包没带这份嵌套子树，
        # 手机上「离线服务 60 秒没起来」= boot 直接 ERR_MODULE_NOT_FOUND。静态引用扫描 + 真
        # import() 模块图，两道都绿才许打 APK（实测：藏掉 public/ 该步骤必须红）。
        run: node tools/apk/check-webroot-boot.mjs

      - name: Gate the webroot overlay set (P0, 2026-10-23 真机报障)
        # 真机报障「点 MOD 管理器没有页面」：webroot 是 gitignore 的构建产物，会静默腐烂 ——
        # 上次构建缺 server/overlay/sp-modmgr.mjs（另两个还是旧字节），而 overlay-loader 只
        # readdir 那一个目录，缺模块连 skipped 都不记，/mod 直接无人应答、页面空白。
        # 这条门禁钉住「源码树有几个、webroot 就必须有几个且逐字节相同」（两头实测都能红）。
        run: node tools/apk/check-webroot-overlays.mjs

      - name: Make content bundle (self-hosted updater mirror)
        # 显式 tag：builtinBuildTag() 依赖内嵌 manifest（0.3.1 同步后它不再带内容 tag），
        # upstreamTagSafe() 在 runner 上查 GitHub API 也可能空手而归 ⇒ 传死，别出 content-bundle-null.zip。
        run: node tools/apk/make-bundle.mjs --tag content-${{ inputs.upstream_tag || 'v0.3.3' }}
      - name: Bake the embedded hot-update baseline (2026-10-21 真机报障)
        # ⚠ 必须放在 make-bundle 之后：gen-manifest 要读 slim 才能签 slim.sha256 / shellOverlay
        #   （2026-10-23 首跑顺序反了，报 slim bundle not found）。
        # 真机现象：检查更新面板显示「当前 VERSION: shell-v2.9.140」，而线上 manifest 早已是
        # shell-v3.4.0。根因：Updater.fetchManifest 取不到/验不过线上清单时**回落内嵌基线**
        # （Updater.java:279-283），而内嵌那份 tools/apk/shell/manifest.json 停在 v2.9.140 ——
        # 因为只有 hotupdate.yml 跑 gen-manifest，本 workflow 从来不跑。
        # 这里补上：签名密钥同一把（SP_SIGN_KEY），产出的 manifest 与热更线同源同格式，
        # 顺带把内嵌基线一起刷新（gen-manifest.mjs:298-301 自己会写）。
        env:
          SP_SIGN_KEY: ${{ secrets.SP_SIGN_KEY }}
        run: |
          set -euo pipefail
          # gen-manifest 从 $HOME/.sp-sign/ed25519.key **文件**读签名密钥（gen-manifest.mjs:289），
          # 不像热更线有独立的「Write the signing key」步骤 —— 这里必须先落盘 + 派生公钥，
          # 用完即删（2026-10-23 首跑报 ENOENT .../ed25519.key）。
          if [ -z "${SP_SIGN_KEY}" ]; then echo "::error::SP_SIGN_KEY secret is missing"; exit 1; fi
          mkdir -p "$HOME/.sp-sign"
          printf '%s' "$SP_SIGN_KEY" > "$HOME/.sp-sign/ed25519.key"
          chmod 600 "$HOME/.sp-sign/ed25519.key"
          node --input-type=module -e "import fs from 'node:fs';import {privateKeyFromSeed,rawPublicOf} from './tools/apk/ed25519.mjs';const d=process.env.HOME+'/.sp-sign';const seed=Buffer.from(fs.readFileSync(d+'/ed25519.key','utf8').trim(),'hex');fs.writeFileSync(d+'/ed25519.pub',rawPublicOf(privateKeyFromSeed(seed)).toString('hex')+String.fromCharCode(10))"
          # tag 必须是「这一个 APK 的真实版本」，否则回落基线的 buildTag 会与设备上的对不上，
          # 面板又会显示一个对不上的版本号。从 build.gradle 读，和下面断言步同一来源。
          VN="$(sed -nE "s/.*versionName[[:space:]]+'([^']+)'.*/\1/p" android/app/build.gradle | head -n1)"
          VC="$(sed -nE "s/.*versionCode[[:space:]]+([0-9]+).*/\1/p" android/app/build.gradle | head -n1)"
          # 本 workflow 的 make-bundle 产物叫 content-bundle-<upstream>.zip（hotupdate 线才叫
          # content-slim-<tag>.zip），而 gen-manifest 缺省按 content-slim-<tag> 找 ⇒ 必须显式传
          # --slim（2026-10-23 两次红都是这个命名差）。
          SLIM="$(ls ../dl-cache/dist/content-bundle-*.zip | head -n1)"
          node tools/apk/gen-manifest.mjs --tag "shell-v${VN}-vc${VC}" --slim "$SLIM" \
            --epoch 1 --min-apk "${VC}" --upstream "${{ inputs.upstream_tag || 'v0.3.3' }}"
          rm -f "$HOME/.sp-sign/ed25519.key" "$HOME/.sp-sign/ed25519.pub"


      - name: Restore signing keystore
        run: echo "${{ secrets.STRONGHOLD_KEYSTORE_B64 }}" | base64 -d > android/stronghold.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        env:
          SP_STORE_PASSWORD: ${{ secrets.SP_STORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      # re-apk 线的版本号 = 上游官方号：这里只**断言**它，绝不改写它。
      - name: Assert the APK version follows the official upstream number
        run: |
          set -euo pipefail
          VN="$(sed -nE "s/.*versionName[[:space:]]+'([^']+)'.*/\1/p" android/app/build.gradle | head -n1)"
          BUILT="$(python -c "import json;print(json.load(open('android/app/build/outputs/apk/release/output-metadata.json'))['elements'][0]['versionName'])")"
          if [ "$VN" != "$BUILT" ]; then
            echo "::error::build.gradle versionName ($VN) != built APK versionName ($BUILT)"; exit 1
          fi
          case "$VN" in
            0.*) ;;
            *) echo "::error::re-apk 线的 versionName 应跟随上游官方号（如 0.2.0），当前是 $VN"; exit 1 ;;
          esac
          # 2026-10-18（业主）：删掉与 package.json 的离线比对 —— 上游 v0.3.1 的 package.json
          # 仍写着 0.3.0，这层比对只会把已经跟上上游 tag 的构建误判成红。版本号继续由下面那次
          # 上游 tag 交叉印证（读不到时只 warning，不阻塞）。

          UP="$(gh release view --repo sganggs/Stronghold-Protocol --json tagName -q .tagName 2>/dev/null || true)"
          if [ -z "$UP" ]; then
            echo "::warning::gh 读不到上游 tag（网络/限流）—— 本次不阻塞"
          else
            UP="${UP#v}"
            if [ "$VN" != "$UP" ]; then
              echo "::error::versionName ($VN) != 上游最新 tag ($UP) —— 把 build.gradle 的 versionName 跟上去（versionCode 保持递增）"
              exit 1
            fi
            echo "and gh confirms it equals the upstream tag $UP"
          fi
          echo "re-apk version: $VN (official numbering)"

      - name: Check APK (signature + per-ABI runtime + embedded webroot)
        run: node tools/apk/check-apk.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach to release (manual dispatch / tag ref)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The APK that just got built must BE the version the release names: on 2026-10-05 the
          # v2.9.6 tag built vc34 bytes because the build.gradle bump had not been published yet,
          # and the mismatch shipped silently (R2 briefly held two identical "different" APKs).
          VER="$(sed -nE "s/.*versionName[[:space:]]+'([^']+)'.*/\1/p" android/app/build.gradle | head -n1)"
          BUILT="$(node -e "console.log(require('./android/app/build/outputs/apk/release/output-metadata.json').elements[0].versionName)")"
          if [ "$VER" != "$BUILT" ]; then
            echo "::error::build.gradle versionName ($VER) != built APK versionName ($BUILT)"
            exit 1
          fi
          # Target release: explicit release_tag input (the Release Controller passes it) →
          # release event tag → tag push ref_name → shell-v<versionName>-vc<versionCode>.
          # 绝不回退到“最新 release”：APK 可能因此挂进错误的版本（2026-10-05 单一发布者收敛）。
          VC="$(node -e "console.log(require('./android/app/build/outputs/apk/release/output-metadata.json').elements[0].versionCode)")"
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="${{ github.event.release.tag_name }}"
          [ -n "$TAG" ] || TAG="${{ github.ref_name }}"
          case "$TAG" in
            shell-*) ;;
            *) TAG="shell-v${VER}-vc${VC}" ;;
          esac
          # One release per APK (owner diktat 2026-10-08): versionName only changes on a new upstream
          # major, so the versionCode is what distinguishes builds — create the (deterministic) release
          # when it does not exist yet instead of refusing, so a bare dispatch ships a new release.
          if ! gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "release $TAG does not exist — creating it (one release per APK)"
            gh release create "$TAG" --repo ${{ github.repository }} \
              --title "re 线 APK ${BUILT}（vc${VC}）" \
              --notes "re 线 APK：versionName ${BUILT} / versionCode ${VC}。" \
              --target "$(git rev-parse HEAD)"
          fi
          echo "attaching to release: $TAG (built versionName=$BUILT vc$VC)"
          # 2026-10-20 发布原子性（参考 Fuhua-code 打包器的 ci/publish.mjs）：上传前记录本地字节的
          # sha256，上传完成后再把**线上那份**拉回来复校。--clobber 是覆盖语义，一旦中途换了字节
          # （缓存污染、并发写、runner 磁盘问题），旧包会被无声替换 —— 设备侧只表现为「下载到的
          # 包装不上」。这一步让那种失败在 CI 里就红，而不是等到用户回报。
          APK="android/app/build/outputs/apk/release/app-release.apk"
          LOCAL_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "local apk sha256: $LOCAL_SHA"
          gh release upload "$TAG" --repo ${{ github.repository }} --clobber "$APK"
          REMOTE_SHA="$(gh release download "$TAG" --repo ${{ github.repository }} \
            --pattern 'app-release.apk' --output - 2>/dev/null | sha256sum | cut -d' ' -f1)"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::published APK sha256 mismatch (local $LOCAL_SHA != remote $REMOTE_SHA) — the release is corrupt"
            exit 1
          fi
          echo "verified: the published bytes are the ones we built ($REMOTE_SHA)"
          # The release TITLE/NOTES must follow the build: the re line re-releases under the same
          # versionName, so a title written once ("…（vc2001）") stays stale forever and the download
          # site shows the old versionCode while the asset bytes are new (2026-10-08: the owner read
          # "vc2001" off the site and concluded the build was stuck). Refresh them from the metadata.
          VC="$(node -e "console.log(require('./android/app/build/outputs/apk/release/output-metadata.json').elements[0].versionCode)")"
          gh release edit "$TAG" --repo ${{ github.repository }} \
            --title "re 线 APK ${BUILT}（vc${VC}）" \
            --notes "re 线（独立产品线）APK：versionName ${BUILT} / versionCode ${VC}（同名重发覆盖，字节以 apk/latest-re.json 的 sha256 为准），与 apk 线同一把 keystore（可直接覆盖升级）。分发指针 = R2 apk/latest-re.json（版本与 sha256 的唯一权威）；内容与首页走 site/manifest-re.json 热更新。"
          echo "release title refreshed: re 线 APK ${BUILT}（vc${VC}）"
          # content-slim is deliberately NOT attached here: CI's Info-ZIP rebuild is not byte-equal to
          # the locally bsdtar-built zip the signed manifest pins in `slim.sha256`, so uploading it
          # would clobber a valid signed artifact with one devices reject (same reason the R2 mirror
          # below skips it). The content bundle (not updater-consumed) is still attached.
          for f in ../dl-cache/dist/content-bundle-*.zip; do
            [ -f "$f" ] && gh release upload "$TAG" --repo ${{ github.repository }} --clobber "$f"
          done

      # Mirror the release output to R2 (weishucdn — the primary CN-friendly source) so ONE build
      # lands in BOTH GitHub and R2. 单一发布者收敛（2026-10-05）：site/manifest.json 只由唯一
      # Release Controller（promote.yml）写——本 workflow 只写 APK 直链 + latest.json（APK
      # 更新指针）+ servers.json，绝不触碰生产 manifest 指针。
      # 2026-10-13（业主指令）：**去掉 R2 发布**。APK 已于同日下线（apk/*.apk 已清空），
      # 这一步原本只剩「写 apk/latest.json + apk/latest-re.json 指针」，而指针指向的 APK 已不存在
      # ⇒ 只会写出死链。指针对象也已从桶里删除。要恢复：还原本步骤 + 恢复上面的 APK 上传 + 重开
      # 下载站侧的 mirror-apk / prune-r2 两个 workflow。
