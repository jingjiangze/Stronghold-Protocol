name: apk

# 2026-10-08 退役：旧 apk 线不再发布。
#
# 统一 R2 命名空间后（tools/apk/line.mjs 的 SUFFIX 改为空串、APK_NAME_PREFIX 置空），
# apk/latest.json、apk/stronghold-v*.apk、assets/、site/servers.json、site/manifest.json
# 全部由 re 线的发布链独占写入（.github/workflows/apk-re.yml + tools/apk/release-re.mjs）。
# 本工作流原先也写 apk/latest.json 与 assets/ —— 留着就是第二个写入者，两边会互相覆盖，
# 所以整条旧线发布链（含它的版本号/产物约定）一并退役。
#
# 需要旧线代码时从 git 历史取：本文件在 2026-10-08 之前是完整的发布链。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: 旧线已退役
        run: |
          echo "::error::旧 apk 线已于 2026-10-08 退役，本工作流不再发布任何产物。"
          echo "统一后的 R2 键由 apk-re.yml（re 线）独占写入；需要旧链请从 git 历史恢复。"
          exit 1
