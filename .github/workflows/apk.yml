name: apk

on:
  push:
    branches: [apk]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # the ubuntu runner ships the Android SDK; just install the packages we need
      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch libnode (nodejs-mobile)
        run: node tools/apk/fetch-libnode.mjs

      - name: Build embedded webroot from upstream release
        run: node tools/apk/build-webroot.mjs

      - name: Restore signing keystore
        run: echo "${{ secrets.STRONGHOLD_KEYSTORE_B64 }}" | base64 -d > android/stronghold.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach to release (tag builds / manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload shell-v2.0.0 --repo ${{ github.repository }} --clobber \
            "android/app/build/outputs/apk/release/app-release.apk#卫戍协议-v2.0.0.apk"
