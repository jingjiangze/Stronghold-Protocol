name: apk-release

# 测试候选通过后的「正式版本号 Release」发布器（2026-10-05 规则）。
#
# 根因：下载站的下载按钮指向 GitHub 的 /releases/latest = **最新的非预发布 release**。
# 此前最新的非预发布 release 是纯内容 release（无 APK）→ 站点指向一个没有 apk 的页面；
# 而真正最新的 APK（链的 T4 构建、闸门验证过）躺在 test-<sha8> 预发布里，站点永远看不到。
#
# 规则：每个通过 T1–T5 的测试候选，把它的 app-release.apk 以 **shell-<buildTag>**（如
# shell-v2.9.18）的名义发成非预发布 release —— 逐字节复制测试工件（sha256 对照 release
# 资产自带 digest），永不重打包。这样 /releases/latest 始终是"带 APK 的最新版本"。
#
# 同时清理存储（每个 APK ~520MB）：test-* 预发布与"同类正式 release"各只保留最新 keep 个。
# 只清理带 tested-id.json 资产的正式 release —— 历史手工壳 release（shell-v2.9.3–2.9.6，
# 无该资产）绝不触碰。
#
# 触发：publish-test 全绿后自动 dispatch（规则本体）；也可手动补发历史候选（retrofit）。
on:
  workflow_dispatch:
    inputs:
      test_tag:
        description: '测试候选 release 标签（test-<sha8>）'
        required: true
      keep:
        description: 'test-* 与同类正式 release 各自保留的最新个数'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

env:
  CDN_BASE: https://weishucdn.jiangjiangze.icu

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the tested artifacts (APK digest + buildTag)
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.test_tag }}"
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" > rel.json
          jq -e '[.assets[] | select(.name == "app-release.apk")] | length == 1' rel.json > /dev/null \
            || { echo "::error::$TAG must carry exactly one app-release.apk"; exit 1; }
          SIZE="$(jq -r '[.assets[] | select(.name == "app-release.apk")][0].size' rel.json)"
          DIGEST="$(jq -r '[.assets[] | select(.name == "app-release.apk")][0].digest // ""' rel.json)"
          DIGEST="${DIGEST#sha256:}"
          [ -n "$DIGEST" ] || { echo "::error::app-release.apk carries no digest"; exit 1; }
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern tested-id.json -O tested-id.json --clobber
          BUILDTAG="$(jq -r '.buildTag // ""' tested-id.json)"
          STAGING="$(jq -r '.staging // ""' tested-id.json)"
          [ -n "$BUILDTAG" ] || { echo "::error::tested-id.json has no buildTag"; exit 1; }
          TARGET="$BUILDTAG"
          case "$TARGET" in
            shell-*) ;;
            *) TARGET="shell-$TARGET" ;;
          esac
          {
            echo "test_tag=$TAG"
            echo "target=$TARGET"
            echo "size=$SIZE"
            echo "digest=$DIGEST"
            echo "staging=$STAGING"
          } >> "$GITHUB_OUTPUT"
          echo "tested artifact: $TAG → formal release $TARGET (APK ${SIZE}B, sha256 ${DIGEST:0:16}…)"

      - name: Create the formal release (non-prerelease) and attach the tested APK byte-for-byte
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: ${{ steps.rel.outputs.test_tag }}
          TARGET: ${{ steps.rel.outputs.target }}
          TARGET_SHA: ${{ steps.rel.outputs.digest }}
          STAGING: ${{ steps.rel.outputs.staging }}
        run: |
          set -euo pipefail
          if ! gh release view "$TARGET" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            printf '%s\n' \
              "出自通过 T1–T5 的测试候选 \`$TEST_TAG\`（staging \`${STAGING:0:8}\`），逐字节复制、未重打包。" \
              "下载站（dl.jiangjiangze.icu）的「最新版本」即本 release；溯源与哈希见资产 tested-id.json。" \
              "" \
              "> CDN 直链（R2）：${{ env.CDN_BASE }}/apk/${TARGET}.apk" \
              > notes.md
            gh release create "$TARGET" --repo "${{ github.repository }}" \
              --title "$TARGET（测试候选 $TEST_TAG 通过）" --notes-file notes.md
            echo "::notice::created formal release $TARGET"
          else
            echo "formal release $TARGET already exists — refreshing assets (--clobber)"
          fi
          gh release download "$TEST_TAG" --repo "${{ github.repository }}" --pattern app-release.apk -O app-release.apk --clobber
          echo "$TARGET_SHA  app-release.apk" | sha256sum -c -
          gh release upload "$TARGET" --repo "${{ github.repository }}" --clobber \
            app-release.apk tested-id.json
          echo "::notice::published $TARGET — /releases/latest now points at a release that carries the tested APK"

      - name: Append the R2 direct link to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.rel.outputs.target }}
        run: |
          set -euo pipefail
          gh release view "$TARGET" --repo "${{ github.repository }}" --json body --jq .body > body.md
          # 规范化：剥掉任何直链行（含历史断行坏块与全角/半角括号变体）与裸 CDN 行，压掉尾部
          # 空行，再统一追加一条单行直链 —— 幂等且能自愈历史坏块（shell-v2.9.22 事故）。
          grep -vE 'CDN 直链|^https://weishucdn\.jiangjiangze\.icu$|^/apk/.*\.apk$' body.md > body-clean.md || true
          while [ -s body-clean.md ] && [ -z "$(tail -1 body-clean.md | tr -d '[:space:]')" ]; do
            sed -i '$d' body-clean.md
          done
          printf '\n> CDN 直链（R2）：%s/apk/%s.apk\n' "${{ env.CDN_BASE }}" "$TARGET" >> body-clean.md
          mv body-clean.md body.md
          gh release edit "$TARGET" --repo "${{ github.repository }}" --notes-file body.md
          echo "::notice::release body normalized (single R2 direct link)"

      - name: Mirror the tested APK into R2 by default (the bucket keeps the newest two APKs)
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          TARGET: ${{ steps.rel.outputs.target }}
          TARGET_SHA: ${{ steps.rel.outputs.digest }}
          STAGING: ${{ steps.rel.outputs.staging }}
        run: |
          set -euo pipefail
          if [ -z "$R2_ACCESS_KEY" ]; then
            echo "::warning::R2 secrets absent — R2 mirror skipped"
            exit 0
          fi
          curl -sL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone-bin
          RC="$(find /tmp/rclone-bin -name rclone -type f | head -1)"
          "$RC" config create r2 s3 provider=Cloudflare access_key_id="$R2_ACCESS_KEY" secret_access_key="$R2_SECRET_KEY" endpoint=https://8641802a2d46497f1cc4e7a4cba365d2.r2.cloudflarestorage.com acl=private --non-interactive > /dev/null
          # versionCode 的权威值 = tested-id.minApk（候选自己的 versionCode）；versionName 从
          # staging 提交（退路：apk 分支）的 build.gradle 读——APK 是编译产物，不在 runner 里解析。
          VC="$(jq -r '.minApk // ""' tested-id.json)"
          VN=""
          for REF in "$STAGING" apk; do
            [ -n "$REF" ] || continue
            BG="$(gh api "repos/${{ github.repository }}/contents/android/app/build.gradle?ref=$REF" --jq .content 2>/dev/null | tr -d '\n' | base64 -d || true)"
            if [ -n "$BG" ]; then
              VN="$(printf '%s' "$BG" | sed -nE "s/.*versionName[[:space:]]+'([^']+)'.*/\1/p" | head -n1)"
              break
            fi
          done
          KEY="apk/${TARGET}.apk"
          "$RC" copyto app-release.apk "r2:stronghold-assets/$KEY" \
            --header-upload "Content-Type: application/vnd.android.package-archive" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --s3-no-check-bucket --s3-upload-cutoff 64M --s3-chunk-size 64M --stats-one-line --stats 30s
          # latest.json：App 内「检查更新」指针（Updater 只依赖 versionCode/versionName/tag/apkUrl；
          # versionCode 未超过已装版本时 App 判定"无新版"，不会误解发更新）。
          VC="$VC" VN="$VN" TARGET_SHA="$TARGET_SHA" node -e '
            const fs = require("fs");
            const t = JSON.parse(fs.readFileSync("tested-id.json", "utf8"));
            const tag = process.env.TARGET;
            const doc = {
              tag,
              versionCode: Number(process.env.VC) || 0,
              versionName: process.env.VN || "",
              apkUrl: `${process.env.CDN_BASE}/apk/${tag}.apk`,
              notesUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${tag}`,
              sha256: process.env.TARGET_SHA,
              size: fs.statSync("app-release.apk").size,
              minApk: t.minApk ?? null,
              buildTag: t.buildTag || null,
              generated: new Date().toISOString(),
            };
            fs.writeFileSync("latest.json", JSON.stringify(doc, null, 2) + "\n");
            console.log("latest.json:", JSON.stringify({ tag: doc.tag, versionCode: doc.versionCode, apkUrl: doc.apkUrl }));
          '
          "$RC" copyto latest.json r2:stronghold-assets/apk/latest.json \
            --header-upload "Content-Type: application/json" --header-upload "Cache-Control: no-cache" --s3-no-check-bucket
          # 保留策略：apk/ 下仅保留**最新两个** APK（按文件名版本号倒序；latest.json 与 slim 不动）。
          KEEP=2
          "$RC" lsf r2:stronghold-assets/apk/ 2>/dev/null | grep -E -- '-v[0-9]+\.[0-9]+\.[0-9]+\.apk$' | while read -r f; do
            printf '%s %s\n' "$(printf '%s' "$f" | sed -nE 's/.*v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')" "$f"
          done | sort -rV | tail -n +$((KEEP + 1)) | awk '{print $2}' | while read -r f; do
            [ -n "$f" ] || continue
            echo "prune r2 apk/$f"
            "$RC" deletefile "r2:stronghold-assets/apk/$f"
          done
          echo "::notice::R2 mirrored: $KEY + latest.json refreshed; the bucket keeps the newest 2 APKs"

      - name: Prune old cycles (keep the newest ${{ inputs.keep }} of each kind; ~520MB per APK)
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          ALL="$(gh api "repos/${{ github.repository }}/releases?per_page=100")"
          for t in $(printf '%s' "$ALL" | jq -r --argjson k "$KEEP" \
            '[.[] | select(.tag_name | startswith("test-"))] | sort_by(.created_at) | reverse | .[$k:] | .[].tag_name'); do
            echo "prune test release: $t"
            gh release delete "$t" --repo "${{ github.repository }}" --cleanup-tag --yes
          done
          for t in $(printf '%s' "$ALL" | jq -r --argjson k "$KEEP" \
            '[.[] | select(any(.assets[]?; .name == "tested-id.json")) | select(.tag_name | startswith("shell-"))] | sort_by(.created_at) | reverse | .[$k:] | .[].tag_name'); do
            echo "prune formal apk release: $t"
            gh release delete "$t" --repo "${{ github.repository }}" --cleanup-tag --yes
          done
          echo "::notice::pruned — kept the newest $KEEP of each kind"
