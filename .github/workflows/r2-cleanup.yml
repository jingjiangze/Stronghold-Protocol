# r2-cleanup.yml — one-off inventory / deletion of the APK + hot-update objects in R2.
#
# WHY: the owner's instruction (2026-10-17) is to remove what was published to R2 — the APK
# objects/pointers and the hot-update artifacts — now that the APK embeds all art and no longer
# depends on R2. The bucket credentials exist ONLY as repo secrets, so this has to run here.
#
# SAFETY: `mode` defaults to `inventory` (read-only). Deletion requires `mode=delete` plus an
# explicit `scope`. `site/servers.json` (the signed server list) and `assets/` (the browser CDN
# tree) are NEVER touched by this workflow — they are not APK or hot-update artifacts.
name: r2-cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory (read-only) or delete'
        required: true
        type: choice
        options: [inventory, delete]
        default: inventory
      scope:
        description: 'what to act on (delete only): apk | hotupdate | both'
        required: false
        type: choice
        options: [apk, hotupdate, both]
        default: apk

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://8641802a2d46497f1cc4e7a4cba365d2.r2.cloudflarestorage.com
    steps:
      - name: Set up rclone
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID}" ]; then echo "::error::R2 secrets absent"; exit 1; fi
          curl -sL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone-bin
          echo "RC=$(find /tmp/rclone-bin -name rclone -type f | head -1)" >> "$GITHUB_ENV"

      - name: Inventory (read-only)
        run: |
          set -euo pipefail
          echo "===== apk/ ====="
          "$RC" lsf -R r2:stronghold-assets/apk --format "sp" || echo "(none)"
          echo "===== apk-test/ ====="
          "$RC" lsf -R r2:stronghold-assets/apk-test --format "sp" || echo "(none)"
          echo "===== site/ ====="
          "$RC" lsf -R r2:stronghold-assets/site --format "sp" || echo "(none)"
          echo "===== other top-level prefixes ====="
          "$RC" lsf r2:stronghold-assets --dirs-only || true
          echo "===== hot-update manifests ====="
          for k in site/manifest.json site/manifest-re.json site/manifest-test.json site/last-tested.json; do
            echo "--- $k ---"
            "$RC" cat "r2:stronghold-assets/$k" 2>/dev/null | head -c 1200 || echo "(absent)"
            echo
          done

      - name: Delete APK objects and pointers
        if: ${{ inputs.mode == 'delete' && (inputs.scope == 'apk' || inputs.scope == 'both') }}
        run: |
          set -euo pipefail
          echo "deleting apk/ and apk-test/ ..."
          "$RC" delete r2:stronghold-assets/apk --rmdirs -v || true
          "$RC" delete r2:stronghold-assets/apk-test --rmdirs -v || true
          echo "remaining under apk/:"
          "$RC" lsf -R r2:stronghold-assets/apk --format "sp" || echo "(empty)"

      - name: Delete hot-update artifacts
        if: ${{ inputs.mode == 'delete' && (inputs.scope == 'hotupdate' || inputs.scope == 'both') }}
        run: |
          set -euo pipefail
          # The production/test manifest pointers + the last-tested marker. Their slim/overlay
          # payloads live under the prefixes the manifests name — list them first, then remove.
          for k in site/manifest.json site/manifest-re.json site/manifest-test.json \
                   site/last-tested.json site/last-tested-re.json; do
            echo "delete $k"
            "$RC" deletefile "r2:stronghold-assets/$k" -v || true
          done
          for p in slim content shell-ui overlay; do
            echo "delete prefix $p/ (if any)"
            "$RC" delete "r2:stronghold-assets/$p" --rmdirs -v || true
          done
          echo "remaining under site/:"
          "$RC" lsf -R r2:stronghold-assets/site --format "sp" || echo "(empty)"

      - name: Final inventory
        if: ${{ inputs.mode == 'delete' }}
        run: |
          set -euo pipefail
          echo "===== apk/ ====="; "$RC" lsf -R r2:stronghold-assets/apk --format "sp" || echo "(empty)"
          echo "===== apk-test/ ====="; "$RC" lsf -R r2:stronghold-assets/apk-test --format "sp" || echo "(empty)"
          echo "===== site/ ====="; "$RC" lsf -R r2:stronghold-assets/site --format "sp" || echo "(empty)"
          echo "===== top-level ====="; "$RC" lsf r2:stronghold-assets --dirs-only || true
