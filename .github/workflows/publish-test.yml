name: publish-test

# apk-test 闸门 + 测试通道发布（《上游同步结构-修订版》Commit 03/05）。
#
# master 上的 sync-upstream.yml 是唯一的同步控制器：它把“当前 apk + 指定 upstream SHA”的
# 候选（含 lineage.json）写入 apk-test。本 workflow 只监听 apk-test，负责：
#   GATE T1 基础安装 → T2 正确性 → T3 候选 webroot 锚点（对精确 upstream SHA）
#   → T4 测试 APK（Termux 双 ABI + webroot + bundles + check-apk）
#   → T5 content-slim 离线验证（模拟设备端解包 + extras 覆盖 + 完整补丁重放）
#   → 全绿才发布测试通道：GitHub 预发布 test-<sha8> + R2 apk-test/ + 签名测试 manifest。
# 测试失败：apk 不动（红 run 即告警）、候选留在 apk-test 供取证。
# 生产提升（PR → apk + 生产 manifest 指针切换）由 promote.yml 负责，不在本文件里。
on:
  push:
    branches: [apk-test]
  workflow_dispatch:

permissions:
  contents: write   # 创建/替换测试 release
  actions: write    # kick promote explicitly (workflow_run events are unreliable
                    # across token-triggered runs — 2026-10-04: the 17:44 all-green
                    # gates never fired the promote workflow_run)

concurrency:
  # apk-test 是 ephemeral 候选分支：控制器一 force-update，旧候选的测试立即作废——
  # 新 run 取消旧 run，避免两个 staging 的测试/发布互相踩（2026-10-05 双发布事故的近亲）。
  group: publish-test-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: sganggs/Stronghold-Protocol

jobs:
  gate-source:
    name: T1-T3 source gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: GATE T1 — install exactly the lockfile + repo check
        run: |
          npm ci --no-audit --no-fund
          # vendor libs are not committed; setup --check needs them present
          node tools/vendor.mjs
          node tools/setup.mjs --check --no-local

      - name: GATE T2 — correctness tests
        run: find test -name '*.test.js' ! -name 'robustness.test.js' | sort | xargs node --test

      - name: GATE T2b — performance smoke (advisory, shared-runner flake tolerated)
        continue-on-error: true
        run: node --test test/sim/robustness.test.js

      - name: GATE T3 — patch anchors against the EXACT upstream SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          UP="$(node -e "try{const l=JSON.parse(require('fs').readFileSync('lineage.json','utf8'));process.stdout.write(l.candidate===process.argv[1]?(l.upstream||''):'')}catch(e){}" "$HEAD_SHA")"
          if [ -z "$UP" ]; then
            echo "no candidate lineage for this staging HEAD ($HEAD_SHA) — baseline run; anchor check skipped"
            exit 0
          fi
          echo "anchor target: upstream $UP"
          gh api "repos/$UPSTREAM_REPO/zipball/$UP" > /tmp/upstream.zip
          mkdir -p /tmp/pt && unzip -q /tmp/upstream.zip -d /tmp/pt
          TREE="$(find /tmp/pt -maxdepth 1 -mindepth 1 -type d | head -1)"
          node tools/apk/check-patches.mjs "$TREE"

      - name: GATE T3b — webroot invariants
        run: |
          for f in public/index.html data/assets.json server/index.js public/js/assets.js; do
            [ -f "$f" ] || { echo "::error::candidate missing $f"; exit 1; }
          done
          grep -q "crossOrigin" public/js/assets.js \
            || { echo "::error::assets.js lost the crossOrigin guard"; exit 1; }
          echo "webroot asserts: ok"

  build:
    name: T4 test APK + bundles
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve the content build tag for this test cycle
        id: tag
        run: |
          TAG="$(node tools/apk/next-content-tag.mjs)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "content buildTag: $TAG"

      - name: Fetch Termux Node 24 runtime (both ABIs)
        run: node tools/apk/fetch-termux-node.mjs

      - name: Build embedded webroot from upstream release (with shell patches)
        env:
          # lifts the shared-runner upstream API rate limit (the 403 of 2026-10-04)
          GH_TOKEN: ${{ github.token }}
        run: node tools/apk/build-webroot.mjs

      - name: Make content bundles (buildTag-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/apk/make-bundle.mjs --tag "${{ steps.tag.outputs.tag }}"

      - name: Restore signing keystore
        run: echo "${{ secrets.STRONGHOLD_KEYSTORE_B64 }}" | base64 -d > android/stronghold.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        env:
          SP_STORE_PASSWORD: ${{ secrets.SP_STORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Check APK (signature + per-ABI runtime + embedded webroot)
        run: node tools/apk/check-apk.mjs

      - name: Stage artifacts
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/out/
          cp ../dl-cache/dist/content-slim-*.zip /tmp/out/
          cp ../dl-cache/dist/content-bundle-*.zip /tmp/out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: apk-test-artifacts
          path: /tmp/out/
          retention-days: 7

  verify-slim:
    name: T5 slim replay simulation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: apk-test-artifacts
          path: artifacts

      - name: GATE T5 — offline slim verification (entry mapping + extras + full patch replay)
        run: |
          SLIM="$(ls artifacts/content-slim-*.zip | head -1)"
          node tools/apk/verify-slim.mjs --slim "$SLIM" \
            --shell android/app/src/main/assets/shell --json /tmp/t5.json

  publish:
    name: Publish test channel
    needs: [gate-source, build, verify-slim]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: apk-test-artifacts
          path: artifacts

      - name: Identities (candidate sha / upstream / content version)
        id: id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse --short=8 HEAD)"
          HEAD_SHA="$(git rev-parse HEAD)"
          UP="$(node -e "try{const l=JSON.parse(require('fs').readFileSync('lineage.json','utf8'));process.stdout.write(l.candidate===process.argv[1]?(l.upstream||''):'')}catch(e){}" "$HEAD_SHA")"
          UP_TAG="$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('lineage.json','utf8')).upstreamTag||'')}catch(e){}")"
          # stale or missing lineage (baseline staging) → resolve the upstream release tag live
          if [ -z "$UP_TAG" ] && [ -n "$UP" ]; then
            UP_TAG="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name 2>/dev/null || echo '')"
          fi
          if [ -n "$UP" ]; then CONTENT="${UP_TAG:-unknown}-${UP:0:8}"; else CONTENT="${UP_TAG:-baseline}"; fi
          {
            echo "sha8=$SHA"
            echo "upstream=$UP"
            echo "upstream_tag=$UP_TAG"
            echo "content_version=$CONTENT"
          } >> "$GITHUB_OUTPUT"
          echo "candidate $SHA · upstream ${UP:-baseline} · contentVersion $CONTENT"

      - name: Resolve minApk from the candidate shell (versionCode)
        id: apk
        run: |
          MIN="$(node -e "const s=require('fs').readFileSync('android/app/build.gradle','utf8');const m=/versionCode\s+(\d+)/.exec(s);process.stdout.write(m?m[1]:'')")"
          if [ -z "$MIN" ]; then echo "::error::cannot read versionCode from android/app/build.gradle"; exit 1; fi
          echo "min=$MIN" >> "$GITHUB_OUTPUT"
          echo "minApk for this candidate: $MIN"

      - name: Sign the test manifest (SP_SIGN_KEY)
        env:
          SP_SIGN_KEY: ${{ secrets.SP_SIGN_KEY }}
          UP_TAG: ${{ steps.id.outputs.upstream_tag }}
          UP_SHA: ${{ steps.id.outputs.upstream }}
          CONTENT: ${{ steps.id.outputs.content_version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          test -n "$SP_SIGN_KEY" || { echo "::error::SP_SIGN_KEY secret missing — cannot sign the test manifest"; exit 1; }
          SLIM="$(ls artifacts/content-slim-*.zip | head -1)"
          # gen-manifest reads the key from $SP_SIGN_DIR/ed25519.key (tree versions differ on
          # SP_SIGN_KEY support; the file path works on every version) — materialise the
          # secret into that shape; CI scratch dir only, removed right after signing.
          export SP_SIGN_DIR="$RUNNER_TEMP/sp-sign"
          mkdir -p "$SP_SIGN_DIR"
          printf '%s\n' "$SP_SIGN_KEY" > "$SP_SIGN_DIR/ed25519.key"
          node tools/apk/gen-manifest.mjs \
            --tag "$TAG" \
            --upstream "${UP_TAG:-v0.1.0}" \
            ${UP_SHA:+--upstream-sha "$UP_SHA"} \
            --content-version "$CONTENT" \
            --min-apk "${{ steps.apk.outputs.min }}" \
            --slim "$SLIM" \
            --slim-url "https://github.com/${{ github.repository }}/releases/download/test-${{ steps.id.outputs.sha8 }}/$(basename "$SLIM")" \
            --out manifest-test.json
          rm -rf "$SP_SIGN_DIR"
          # self-check with the pinned public key (the exact key baked into the APK)
          node tools/apk/sign.mjs verify manifest-test.json --pub-bin tools/apk/shell/pubkey.bin

      - name: Build tested-id.json (the single identity record promote anchors on)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SLIM="$(ls artifacts/content-slim-*.zip | head -1)"
          export ART_SHA="$(sha256sum "$SLIM" | cut -d' ' -f1)"
          export ART_SIZE="$(stat -c %s "$SLIM")"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest-test.json", "utf8"));
            const L = fs.existsSync("lineage.json") ? JSON.parse(fs.readFileSync("lineage.json", "utf8")) : {};
            const slimSha = (m.slim || {}).sha256 || "";
            if (slimSha && slimSha !== process.env.ART_SHA) {
              console.error("manifest-test slim.sha256 != artifact:", slimSha, process.env.ART_SHA);
              process.exit(1);
            }
            const doc = {
              staging: process.env.GITHUB_SHA,
              candidate: L.candidate || null,
              apkBase: L.apkBase || null,
              upstream: L.upstream || null,
              upstreamTag: L.upstreamTag || "",
              buildTag: m.buildTag,
              overlay: (m.shellOverlay || {}).version || null,
              minApk: m.minApk,
              slimSha256: slimSha,
              slimSize: (m.slim || {}).size || null,
              artifactSha256: process.env.ART_SHA,
              artifactSize: Number(process.env.ART_SIZE),
              createdAt: new Date().toISOString(),
              runId: process.env.GITHUB_RUN_ID,
            };
            fs.writeFileSync("tested-id.json", JSON.stringify(doc, null, 2) + "\n");
            console.log("tested-id:", JSON.stringify(doc));
          '

      - name: Publish test manifest + slim mirror to R2 (apk-test/)
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          if [ -z "$R2_ACCESS_KEY" ]; then
            echo "::warning::R2 secrets absent — test channel not mirrored to R2"
            exit 0
          fi
          curl -sL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone-bin
          RC=$(find /tmp/rclone-bin -name rclone -type f | head -1)
          "$RC" config create r2 s3 provider=Cloudflare access_key_id="$R2_ACCESS_KEY" secret_access_key="$R2_SECRET_KEY" endpoint=https://8641802a2d46497f1cc4e7a4cba365d2.r2.cloudflarestorage.com acl=private --non-interactive > /dev/null
          SLIM="$(ls artifacts/content-slim-*.zip | head -1)"
          "$RC" copyto manifest-test.json r2:stronghold-assets/site/manifest-test.json
          # 唯一身份记录（promote 的多重 identity guard 只认它，不读可变分支头）
          "$RC" copyto tested-id.json r2:stronghold-assets/site/last-tested.json
          "$RC" copyto "$SLIM" "r2:stronghold-assets/apk-test/$(basename "$SLIM")"

      - name: Create/replace the test release (test-<sha8> — forensics + acceptance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${{ steps.id.outputs.sha8 }}"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "${{ github.repository }}" --prerelease \
            --target "${GITHUB_SHA}" \
            --title "测试候选 ${{ steps.id.outputs.sha8 }}" \
            --notes "apk-test 全绿（T1–T5）。upstream: ${{ steps.id.outputs.upstream || 'baseline' }} · contentVersion: ${{ steps.id.outputs.content_version }} · buildTag: ${{ needs.build.outputs.tag }}。测试 APK + content-slim + 签名测试清单 + tested-id.json（唯一身份记录）；生产指针由 promote.yml 切换。" \
            artifacts/app-release.apk artifacts/content-slim-*.zip manifest-test.json tested-id.json

      - name: Kick promote (the gates are green; the workflow_run trigger alone proved unreliable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # F3: 把被测 staging 提交显式传给 promote——它只认这个提交，杜绝“A 被测、B 覆盖
          # apk-test、promote 错拿 B”的竞态。
          gh workflow run promote.yml --repo "${{ github.repository }}" --ref master \
            --field staging="${GITHUB_SHA}" \
            || echo "::error::could not dispatch promote — run manually: gh workflow run promote.yml -f staging=${GITHUB_SHA}"
