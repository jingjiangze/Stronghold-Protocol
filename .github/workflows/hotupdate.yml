# hotupdate.yml — build + sign + publish a hot-update package (no R2 anywhere).
#
# WHY: the pointers moved to GitHub (release tag `manifest`) and the numbering restarted at 0.0.1
# with an `epoch` field (see Updater.currentEpoch). This workflow produces the two objects the
# device needs and publishes them:
#   1. `content-slim-<tag>.zip` on the release `<tag>`  (the code/overlay payload)
#   2. `manifest.json` on the release `manifest`        (the signed pointer)
#
# The signing key lives ONLY in the `SP_SIGN_KEY` secret (same one publish-test.yml uses); it is
# written to ~/.sp-sign for this job and never persists.
name: hotupdate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Content tag (e.g. shell-v0.0.1). Must be higher than what devices carry.'
        required: true
        default: 'shell-v0.0.1'
      epoch:
        description: 'Version epoch (1 = the restarted 0.0.x numbering)'
        required: true
        default: '1'
      min_apk:
        description: 'Minimum versionCode allowed to hot-update (below it, go get the APK)'
        required: true
        default: '2041'
      upstream_tag:
        description: 'Upstream release tag the slim is built from (empty = lineage.json; MUST match the APK line)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SP_WEBP_ENCODER: pillow
      PILLOW_PIN: 'Pillow==12.3.0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream tag (lineage.json is the source of truth)
        # 2026-10-25 自动化：上游 tag 只存在 lineage.json（数据文件）里，automation 改它即可，
        # 无需触碰 .github/workflows（GITHUB_TOKEN 无权推送 workflow 文件）。
        id: up
        run: |
          TAG="$(node tools/apk/upstream-tag.mjs '${{ inputs.upstream_tag }}')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "UP_TAG=$TAG" >> "$GITHUB_ENV"
          echo "upstream tag: $TAG"

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Ensure the pinned Pillow for the PNG→WebP asset transcode
        run: python3 -m pip install --quiet "$PILLOW_PIN"

      - name: Build the webroot (upstream + shell extras + overlays)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 2026-10-19 P0：不钉 tag 时 build-webroot 取 upstream 的**最新 release**（实测 v0.1.0），
          # 而 APK 线已是 v0.3.1 —— 热更会把设备内容降级。必须与 APK 线同源。
          SP_UPSTREAM_TAG: ${{ env.UP_TAG }}
        run: node tools/apk/build-webroot.mjs

      - name: Build the slim bundle
        run: node tools/apk/make-bundle.mjs --slim-only --tag "${{ inputs.tag }}"

      - name: Write the signing key
        env:
          SP_SIGN_KEY: ${{ secrets.SP_SIGN_KEY }}
        run: |
          set -euo pipefail
          # 2026-10-25 自动化：上游 tag 真源 = lineage.json（空 input 时）。
          if [ -z "${SP_SIGN_KEY}" ]; then echo "::error::SP_SIGN_KEY secret is missing"; exit 1; fi
          mkdir -p "$HOME/.sp-sign"
          printf '%s' "$SP_SIGN_KEY" > "$HOME/.sp-sign/ed25519.key"
          chmod 600 "$HOME/.sp-sign/ed25519.key"
          # gen-manifest reads the public key too (for keyId); derive it from the seed.
          node --input-type=module -e "import fs from 'node:fs';import {privateKeyFromSeed,rawPublicOf} from './tools/apk/ed25519.mjs';const d=process.env.HOME+'/.sp-sign';const seed=Buffer.from(fs.readFileSync(d+'/ed25519.key','utf8').trim(),'hex');fs.writeFileSync(d+'/ed25519.pub',rawPublicOf(privateKeyFromSeed(seed)).toString('hex')+String.fromCharCode(10))"

      - name: Generate + sign the manifest
        run: |
          set -euo pipefail
          node tools/apk/gen-manifest.mjs --tag "${{ inputs.tag }}" --epoch "${{ inputs.epoch }}" \
            --min-apk "${{ inputs.min_apk }}" --upstream "$UP_TAG"
          node tools/apk/sign.mjs verify tools/apk/shell/manifest.json

      - name: Create the content release and upload the slim
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --prerelease \
              --title "content $TAG" --notes "Hot-update payload $TAG (slim bundle only)."
          fi
          # 2026-10-20 发布原子性（参考 Fuhua-code 打包器的 ci/publish.mjs）：slim 上传后复校字节。
          # 这里比 APK 更关键 —— 签名 manifest 里钉的 `slim.sha256` 就是设备的采纳门，一旦线上那份
          # 与签名值不符，所有设备都会在下载后拒绝安装，而 CI 表面还是绿的。
          SLIM="../dl-cache/dist/content-slim-${TAG}.zip"
          LOCAL_SHA="$(sha256sum "$SLIM" | cut -d' ' -f1)"
          echo "local slim sha256: $LOCAL_SHA"
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "$SLIM"
          REMOTE_SHA="$(gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "content-slim-${TAG}.zip" --output - 2>/dev/null | sha256sum | cut -d' ' -f1)"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::published slim sha256 mismatch (local $LOCAL_SHA != remote $REMOTE_SHA) — devices would refuse it"
            exit 1
          fi
          # 与签名 manifest 里钉的值再对一次（gen-manifest 写的 slim.sha256 必须就是线上这份）
          PINNED_SHA="$(node -e "console.log(require('./tools/apk/shell/manifest.json').slim.sha256||'')")"
          if [ -n "$PINNED_SHA" ] && [ "$PINNED_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::signed manifest pins slim.sha256=$PINNED_SHA but the release carries $REMOTE_SHA"
            exit 1
          fi
          echo "verified: the published slim is the signed one ($REMOTE_SHA)"

      - name: Upload the signed manifest to the `manifest` pointer release
        run: |
          set -euo pipefail
          if ! gh release view manifest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create manifest --repo "${{ github.repository }}" --prerelease \
              --title "hot-update pointers" --notes "Signed server list + hot-update manifest."
          fi
          gh release upload manifest --repo "${{ github.repository }}" --clobber \
            tools/apk/shell/manifest.json tools/apk/shell/servers.json

      - name: Report
        run: |
          echo "slim  : https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/content-slim-${{ inputs.tag }}.zip"
          echo "pointer: https://github.com/${{ github.repository }}/releases/download/manifest/manifest.json"
          node -e "const m=require('./tools/apk/shell/manifest.json');console.log('buildTag',m.buildTag,'epoch',m.epoch,'minApk',m.minApk,'slim',m.slim.size)"
