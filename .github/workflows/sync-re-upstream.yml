name: sync-re-upstream

# re 线（rel2025）的**上游滚动更新控制器**（2026-10-25 重写：git 层「不 merge」，见 ②）。
#
# 设计约束（每条都来自 2026-10-25 的链路审计，改动前先读）：
#   ① **目标分支 = rel2025**。旧版写死 `re-apk`，而 apk-re/hotupdate 全部以 rel2025 为源 ⇒
#      旧控制器推的是另一条分支，等于白跑。分支可用 input 覆盖。
#   ② **零冲突模型：不 merge，改为「上游区整体物化」**。本仓把整棵上游代码 vendored 进 git
#      （public/ server/ shared/ data/ test/ docs/ …），而我们的线与上游在 0.2.5 就分叉了 ⇒
#      `git merge` 会把上游改过的每个文件都算成冲突（v0.3.3 实测 **1072 个**），任何合并策略都只是
#      「怎么处理冲突」，不是「避免冲突」。真正的事实是：**发货的 webroot 来自上游 release +
#      extras + overlay（build-webroot.mjs），这份 vendored 树只服务门禁与上游测试套件**
#      （实测：APK 内的 net.js/views.js/protocol.js 里我们那批 vendored 改动 0 命中）。
#      所以同步 = 用 tools/apk/sync-upstream.mjs 把上游 tag 的每个文件原样写进来；受保护路径
#      （android/ .github/ tools/apk/ tools/security/ lineage.json .gitignore eslint.config.js
#      docs/APK.md scripts/build-apk.ps1）一个字节都不碰。没有 merge ⇒ 结构上不可能冲突，重复跑
#      幂等（实测 v0.3.3 干跑：2370 上游文件 / 2332 已一致 / 30 还原 / 1 删除）。
#   ③ **自动化不改 .github/workflows**：GITHUB_TOKEN 无权推送 workflow 文件。上游 tag 的真源放在
#      `lineage.json`（数据文件），由 tools/apk/roll-bump.mjs 改；本 workflow 从不触碰 workflows。
#   ④ **版本单调**：设备按 buildTag 里第一段 `d.d.d` 比较（Updater.parseTag），所以热更 tag 必须
#      沿用我们自己的 shell-v3.x.y 计数（lineage.hotTag 自增），绝不能用上游的 0.x.y。
#   ⑤ 合并后先跑**全量壳门禁**（node --test tools/apk/*.test.mjs + 上游契约三件套）。红 → 不推、
#      不开构建、开 issue 并把失败清单贴进 summary（人只需要修门禁，不用重跑合并）。
#   ⑥ 门禁绿 → 推 rel2025 → dispatch apk-re（等它绿）→ dispatch hotupdate（等它绿）。
#      任一步红 → issue + summary，链停在那儿，不产生半成品发布。
on:
  schedule:
    # 每 4 小时 37 分（与其它定时任务错峰）。上游发版后 ≤4h 自动跟进。
    - cron: '37 */4 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '指定上游 tag（空 = 查 sganggs 最新 release）'
        required: false
        default: ''
      branch:
        description: '要更新的分支'
        required: false
        default: 'rel2025'
      dry_run:
        description: '只跑合并 + 门禁，不推、不构建、不发布'
        required: false
        type: boolean
        default: false
      skip_build:
        description: '只推 rel2025，不 dispatch apk-re / hotupdate'
        required: false
        type: boolean
        default: false
      force:
        description: 'lineage 已是该 tag 时也继续（上次构建/发布失败后重试用）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write     # 推 rel2025
  actions: write      # gh workflow run（publish-test.yml:18-22 是同一用法的活先例）
  issues: write       # 失败落 issue

concurrency:
  group: sync-re-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: sganggs/Stronghold-Protocol
  SP_WEBP_ENCODER: pillow
  PILLOW_PIN: 'Pillow==12.3.0'

jobs:
  roll:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the line branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || 'rel2025' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Ensure the pinned Pillow for the PNG→WebP asset transcode
        # 与 apk-re 同一口径：素材转码门禁（transcode-assets 的 digest 测试）在无 Pillow 的
        # runner 上会产出不同的 manifest 哈希 ⇒ 全量套件假红（2026-10-26 实测）。
        run: python3 -m pip install --quiet 'Pillow==12.3.0'

      - name: Resolve the upstream target tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [ -n "$WANT" ]; then
            TAG="$WANT"
          else
            TAG="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq '.tag_name')"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::upstream tag is not vX.Y.Z: '$TAG'"; exit 1
          fi
          SHA="$(gh api "repos/$UPSTREAM_REPO/commits/$TAG" --jq '.sha')"
          CUR="$(node tools/apk/upstream-tag.mjs)"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"
          echo "cur=$CUR"   >> "$GITHUB_OUTPUT"
          echo "upstream latest = $TAG ($SHA); our lineage = $CUR"
          # 同步模型下上游提交永远不会成为 HEAD 的祖先（我们不 merge）⇒ 判据只能是 lineage 里记的
          # 上游 tag；force=true 时即使已记录也继续（用于上次构建/发布失败后的重试）。
          if [ "$TAG" = "$CUR" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "already on $TAG — nothing to roll"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialise the upstream tag into our tree (no merge — impossible to conflict)
        id: merge
        if: steps.target.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UP_SHA: ${{ steps.target.outputs.sha }}
          UP_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "stronghold-roll-bot"
          git config user.email "actions@users.noreply.github.com"
          # fetch from the upstream repo itself (our fork's master is a stale mirror)
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" 2>/dev/null || true
          git fetch --force upstream "+refs/tags/$UP_TAG:refs/tags/$UP_TAG" ||             git fetch --force upstream "refs/heads/master:refs/remotes/upstream-src"
          REF="$UP_TAG"
          git cat-file -e "$REF^{commit}" || REF=refs/remotes/upstream-src
          # 上游优先 + 零冲突：整个上游区（public/ server/ shared/ data/ test/ docs/ …）按 tag 物化，
          # 我们的受保护路径（android/ .github/ tools/apk/ lineage.json …）一个字节都不碰。
          node tools/apk/sync-upstream.mjs --from "$REF"
          echo "--- tree after sync ---"
          git status --porcelain | head -60

      - name: Bump version pins (versionCode / versionName / lineage / hotTag)
        id: bump
        if: steps.target.outputs.done == 'false'
        env:
          UP_TAG: ${{ steps.target.outputs.tag }}
          UP_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          PILLOW_PIN="$PILLOW_PIN" SP_WEBP_ENCODER=pillow node tools/apk/roll-bump.mjs --tag "$UP_TAG" --sha "$UP_SHA"
          HOT="$(node -p "require('./lineage.json').hotTag")"
          VC="$(sed -nE "s/.*versionCode[[:space:]]+([0-9]+).*/\1/p" android/app/build.gradle | head -n1)"
          echo "hotTag=$HOT" >> "$GITHUB_OUTPUT"
          echo "vc=$VC"     >> "$GITHUB_OUTPUT"

      - name: GATE — full shell suite on the merged tree
        if: steps.target.outputs.done == 'false'
        run: node --test tools/apk/*.test.mjs

      - name: GATE — upstream contract trio against the new tag
        if: steps.target.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UP_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$UPSTREAM_REPO/zipball/$UP_TAG" > /tmp/upstream.zip
          mkdir -p /tmp/anchor && unzip -q /tmp/upstream.zip -d /tmp/anchor
          TREE="$(find /tmp/anchor -maxdepth 1 -mindepth 1 -type d | head -1)"
          node tools/apk/check-patches.mjs "$TREE"
          node tools/apk/check-upstream-contract.mjs "$TREE"
          node tools/apk/check-extras-overlap.mjs "$TREE"

      - name: Commit the bump
        id: commit
        if: steps.target.outputs.done == 'false'
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "no bump to commit"
          else
            git commit -m "chore(roll): upstream ${{ steps.target.outputs.tag }} → vc${{ steps.bump.outputs.vc }} / ${{ steps.bump.outputs.hotTag }}"
          fi
          git log --oneline -2

      - name: Push the branch
        id: push
        if: steps.target.outputs.done == 'false' && inputs.dry_run != true
        env:
          BRANCH: ${{ inputs.branch || 'rel2025' }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$BRANCH"
          echo "pushed $(git rev-parse --short HEAD) -> $BRANCH"

      - name: Dispatch apk-re and wait
        id: apk
        if: steps.push.outcome == 'success' && inputs.skip_build != true
        env:
          GH_TOKEN: ${{ github.token }}
          UP_TAG: ${{ steps.target.outputs.tag }}
          BRANCH: ${{ inputs.branch || 'rel2025' }}
        run: |
          set -euo pipefail
          gh workflow run apk-re.yml --ref "$BRANCH" -f upstream_tag="$UP_TAG"
          sleep 10
          RID="$(gh run list --workflow apk-re.yml --branch "$BRANCH" --event workflow_dispatch \
                  --limit 1 --json databaseId --jq '.[0].databaseId')"
          echo "apk-re run: $RID"
          gh run watch "$RID" --exit-status --interval 30
          echo "apk-re green"

      - name: Dispatch hotupdate and wait
        id: hot
        if: steps.apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          UP_TAG: ${{ steps.target.outputs.tag }}
          HOT: ${{ steps.bump.outputs.hotTag }}
          VC: ${{ steps.bump.outputs.vc }}
          BRANCH: ${{ inputs.branch || 'rel2025' }}
        run: |
          set -euo pipefail
          # min_apk = 本次 APK 的 versionCode：新内容只下发给已经装上这个 APK 的设备。
          # （上游合并通常不改原生层，但版本号已前进；用新 vc 做地板最保守，旧壳不会吃新内容。）
          gh workflow run hotupdate.yml --ref "$BRANCH" \
            -f tag="$HOT" -f epoch=1 -f min_apk="$VC" -f upstream_tag="$UP_TAG"
          sleep 10
          RID="$(gh run list --workflow hotupdate.yml --branch "$BRANCH" --event workflow_dispatch \
                  --limit 1 --json databaseId --jq '.[0].databaseId')"
          echo "hotupdate run: $RID"
          gh run watch "$RID" --exit-status --interval 30
          echo "hotupdate green"

      - name: Summary
        if: always()
        run: |
          {
            echo "## upstream roll"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 tag | ${{ steps.target.outputs.tag || '(未解析)' }} |"
            echo "| 合并前 lineage | ${{ steps.target.outputs.cur || '-' }} |"
            echo "| 已是最新 | ${{ steps.target.outputs.done }} |"
            echo "| 新 versionCode | ${{ steps.bump.outputs.vc || '-' }} |"
            echo "| 热更 tag | ${{ steps.bump.outputs.hotTag || '-' }} |"
            echo "| dry_run | ${{ inputs.dry_run }} |"
            echo "| 已推送 | ${{ steps.push.outcome || 'skipped' }} |"
            echo "| apk-re | ${{ steps.apk.outcome || 'skipped' }} |"
            echo "| hotupdate | ${{ steps.hot.outcome || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure as an issue
        if: failure() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="upstream roll 失败：${{ steps.target.outputs.tag || 'unknown' }}"
          BODY="$(printf '自动上游滚动停在某一步，**没有产生半成品发布**。\n\n- 上游 tag: `%s`\n- 分支: `%s`\n- run: %s/%s/actions/runs/%s\n\n请按 run 日志修门禁/适配后，手动 `workflow_dispatch` 本 workflow 重跑（已合并的部分会走 already-on 短路或重新合并）。\n' \
            "${{ steps.target.outputs.tag }}" "${{ inputs.branch || 'rel2025' }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          EXIST="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
