name: mirror-master

# 上游持续同步（**只认大版本**）：把 sganggs/Stronghold-Protocol 的**最新 release tag** 合进本 fork 的 master。
#
# 2026-10-09 业主口径：「github仓库滚动更新最新上游文件（仅大版本，每天探测4次）ci测试自动后推送
# （之前做过自动滚动更新的流程，优先复用，不要建太多临时分支，临时分支测试后一定删除）」。
#   · 同步单位 = 上游最新正式 release（prerelease=false）的 tag → 该 tag 的 commit；不再跟上游 master 的每个提交。
#   · 频率 = 每天 4 次（本文件 schedule；fork 里 scheduled workflow 可能被禁，另有外部 ticker 打 workflow_dispatch）。
#   · 门禁（GATE A–E）全绿才 push master；红了一律**只开/更新 issue**，绝不建临时分支、也不开 PR
#     （本仓未开 "Allow GitHub Actions to create and approve pull requests"，开 PR 必然失败）。
#
# 三条纪律：
#   1. merge，不 reset —— 本地自有的控制面提交不会被上游覆盖。
#   2. 门控在 push 之前 —— 用 GITHUB_TOKEN 推 master 不会触发 ci.yml，所以测试必须在这里跑。
#   3. 失败必须响，但**不留分支** —— issue 里带冲突/门禁清单；要复查就重跑本 workflow（幂等）。
#
# 已知唯一需要人工的点（罕见）：上游改了它自己的 .github/workflows/ci.yml 时，GITHUB_TOKEN 推不了
# workflow 文件（R-08），本车道会把 .github/workflows 还原成我们的；若因此让上游的 test/ci.test.js
#（ci.yml ↔ tools/ci.mjs 一致性测试，0.2.2 起有）变红，就由人**本机**把 ci.yml 对齐到上游那版再重跑
#（2026-10-09 已对齐到 0.2.2）。详见 stronghold-apk/审计-滚动更新上游与自动化接管-2026-10-09.md

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '上游 release tag（留空 = 取最新非 prerelease；也可填 v0.2.2 指定）'
        required: false
        default: ''
  schedule:
    - cron: '17 1,7,13,19 * * *'   # 每天 4 次

permissions:
  contents: write
  issues: write

concurrency:
  group: mirror-master
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/sganggs/Stronghold-Protocol.git
  UPSTREAM_REPO: sganggs/Stronghold-Protocol

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master (full history)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve the latest upstream release (大版本)
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          if [ -n "${PIN:-}" ]; then
            TAG="$PIN"
          else
            TAG="$(gh api "repos/$UPSTREAM_REPO/releases" --paginate \
              --jq '[.[] | select(.prerelease | not)] | sort_by(.published_at) | last | .tag_name')"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::cannot resolve an upstream release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git fetch --no-tags --force upstream "refs/tags/$TAG"
          SHA="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "$SHA" || { echo "::error::upstream $SHA not fetchable"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "upstream release: $TAG = $SHA"
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "upstream $TAG ($SHA) already merged — nothing to do"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream release
        if: steps.up.outputs.done != 'true'
        id: merge
        run: |
          TAG="${{ steps.up.outputs.tag }}"
          SHA="${{ steps.up.outputs.sha }}"
          git config user.name "stronghold-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if git merge --no-edit "$SHA" -m "sync: upstream $TAG ($SHA) into master"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "merged $(git rev-parse --short HEAD)"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt" || true
            git merge --abort || true
            {
              echo "## master ← upstream ${{ env.UPSTREAM_REPO }}@$TAG：git 层冲突"
              echo
              echo '这次没有推任何东西，master 保持原样。需要人工在本地解冲突后重跑。'
              echo
              echo '```'
              cat "$RUNNER_TEMP/conflicts.txt" 2>/dev/null || echo '(空——可能是重命名/子模块冲突)'
              echo '```'
            } > /tmp/sync-report.md
            cat /tmp/sync-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::error::upstream $TAG ($SHA) does not merge cleanly into master"
          fi

      - name: Keep our workflows (upstream must never edit them)
        if: steps.merge.outputs.merged == 'true'
        run: |
          # A merge carrying upstream's .github/workflows changes cannot be pushed by GITHUB_TOKEN
          # ("a GitHub App without the workflows permission can neither create nor update …"). Upstream's CI
          # is not ours to run either way, so restore the whole directory to OUR side (the 43124c9 discipline)
          # and fold it into the merge commit — the pushed tree then contains no workflow change at all.
          BEFORE="$(git rev-parse HEAD^1)"
          git checkout "$BEFORE" -- .github/workflows/
          while IFS= read -r f; do
            git cat-file -e "$BEFORE:$f" 2>/dev/null || git rm -f --quiet "$f"
          done < <(git ls-files .github/workflows/)
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
            echo "restored our .github/workflows into the merge commit"
          fi

      - name: GATE A — install exactly the lockfile
        if: steps.merge.outputs.merged == 'true'
        run: npm ci --no-audit --no-fund

      - name: GATE B — correctness tests
        if: steps.merge.outputs.merged == 'true'
        run: |
          # 与 sync-re-upstream 的 GATE 3 同源；浏览器测试未设 RENDER_E2E=1 时自行跳过。
          find test -name '*.test.js' ! -name 'robustness.test.js' | sort | xargs node --test

      - name: GATE C — performance smoke (advisory)
        if: steps.merge.outputs.merged == 'true'
        continue-on-error: true
        run: node --test test/sim/robustness.test.js

      - name: GATE D — upstream pristine (the zero-conflict contract)
        if: steps.merge.outputs.merged == 'true'
        env:
          UP_SHA: ${{ steps.up.outputs.sha }}
        run: |
          # Upstream game code must stay byte-identical: our changes live in control-plane paths or in NEW
          # files (the shell overlay). A modified upstream file is what makes the next sync conflict.
          node tools/apk/check-upstream-pristine.mjs "$UP_SHA"

      - name: GATE E — shell overlay tests
        if: steps.merge.outputs.merged == 'true'
        run: node --test tools/apk/combat-pool-overlay.test.mjs

      - name: Push master
        if: steps.merge.outputs.merged == 'true' && steps.up.outputs.done != 'true'
        run: |
          git push origin HEAD:master
          {
            echo "### master 已同步"
            echo "- upstream release: ${{ steps.up.outputs.tag }} (${{ steps.up.outputs.sha }})"
            echo "- master -> $(git rev-parse HEAD)"
            echo "- 合入提交数: $(git rev-list --count HEAD^1..${{ steps.up.outputs.sha }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail loudly (conflict or red gate -> an issue, never a branch)
        if: always() && steps.up.outputs.done != 'true' && (steps.merge.outputs.merged != 'true' || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=/tmp/sync-report.md
          if [ "${{ steps.merge.outputs.merged }}" = "true" ]; then
            {
              echo "## master ← upstream ${{ steps.up.outputs.tag }}：门禁红（master 未改动）"
              echo
              echo '合并本身干净，是 GATE A–E 里有红的 —— 逐条看本次 run 的日志。'
              echo '若红的是上游的 `test/ci.test.js`（ci.yml ↔ tools/ci.mjs 一致性测试），'
              echo '说明上游改了自己的 ci.yml：由人在**本机**把 `.github/workflows/ci.yml` 对齐上游那版，'
              echo '再重跑本 workflow（本仓 GITHUB_TOKEN 推不了 workflow 文件，见 R-08）。'
            } > "$BODY"
          fi
          [ -f "$BODY" ] || printf '同步被拦下，但没有留下报告文件——请看本次 run 的日志。' > "$BODY"
          printf '\n---\nrun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$BODY"
          TITLE="[master] 上游同步被拦下（$(date -u +%Y-%m-%d)）"
          # 同一个未解决的中断只留一个 issue：有开着的就追加评论。
          EXIST="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "上游同步被拦下 in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --repo "$GITHUB_REPOSITORY" --body-file "$BODY"
            echo "commented on issue #$EXIST"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY" \
              --label upstream-sync 2>/dev/null \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY"
          fi
          exit 1
